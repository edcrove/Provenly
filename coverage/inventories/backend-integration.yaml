# Backend Integration inventory: interactions across application, persistence
# and infrastructure, verified against real PostgreSQL (testcontainers-go).
# Every sqlc query is ALSO a target automatically (BE-INT-Q:<module>.<Query>),
# derived from backend/queries/*.sql — adding a query adds a target.
# A target is covered when a passing test (subtest) name contains its id.
targets:
  - id: BE-INT-001
    description: goose migrations apply, roll back and re-apply reproducibly
  - id: BE-INT-002
    description: TC-IDs are assigned by the database (identity), increasing and never reused
  - id: BE-INT-003
    description: database forbids deleting test cases and changing a TC-ID, naming the TC-ID in the error
  - id: BE-INT-004
    description: test case CRUD round-trip through the catalog service on Postgres (idempotent deprecation)
  - id: BE-INT-005
    description: expected universe query returns exactly active AND automated test cases
  - id: BE-INT-006
    description: steps keep a persistent contiguous order (insert/shift, reorder under deferrable unique constraint, delete/renumber)
  - id: BE-INT-007
    description: concurrent step creation is serialized per test case (row lock)
  - id: BE-INT-008
    description: duplicate ingestion of the same externalRunId is idempotent, also under concurrency; a different report is not applied and warned
  - id: BE-INT-009
    description: a rerun attempt creates a new run and preserves the previous attempt's history
  - id: BE-INT-010
    description: the expected-universe snapshot is immutable and isolated from later catalog changes
  - id: BE-INT-011
    description: database enforces result/run invariants (TC-ID link only for valid/deprecated, no untested rows, externalRunId format)
  - id: BE-INT-012
    description: JUnit ingestion persists run, results and TC-ID diagnostics end to end on Postgres (deprecated results stay in history)
  - id: BE-INT-013
    description: run results filters (status, correlation) and pagination
  - id: BE-INT-014
    description: result history of a TC-ID across runs with observed execution metadata
  - id: BE-INT-015
    description: CLI migrates and serves against Postgres, and reports connection failures
  - id: BE-INT-016
    description: failed transactions roll back every write
  - id: BE-INT-017
    description: valid results outside the run snapshot are persisted, excluded from the summary and their TC-IDs listed
  - id: BE-INT-018
    description: parse errors and unknown durations are stored with the run, listed and replayed
  - id: BE-INT-019
    description: the run execution status reported by CI (completed/interrupted/cancelled) is stored and never changed by replays
  - id: BE-INT-020
    description: every persistence adapter method propagates a database failure (closed pool) instead of hiding it
  - id: BE-INT-021
    description: editing test case content and steps (edit, reorder, delete) keeps the TC-ID and leaves the result history unchanged
  - id: BE-INT-022
    description: readiness reflects database reachability (200 with a live pool, 503 Problem once the pool is closed)
  - id: BE-INT-023
    description: database enforces step integrity (owning test case exists and never changes, non-blank action, expected result at most 2000 characters)
  - id: BE-INT-024
    description: database protects run identity (external id, provider, run id, attempt, report digest), forbids deleting runs and adding TC-IDs to an existing snapshot, and keeps startedAt <= completedAt; replays warn about differing metadata
  - id: BE-INT-025
    description: ingested results and parse errors are immutable (no insert after the run is created, no update, no delete), so the verdict always reflects the report
  - id: BE-INT-026
    description: database enforces test case integrity (non-blank title, description and expected result at most 10000 characters, deprecated_at set exactly when deprecated, updated_at not before created_at)
  - id: BE-INT-027
    description: the run snapshot and the result correlations come from one catalog read, so they agree when a test case is deprecated during an ingestion
  - id: BE-INT-028
    description: concurrent partial edits of different test case fields all persist (a PATCH writes only the fields it sends)
  - id: BE-INT-029
    description: deep history and run-list pages cost no more than the first (20k results for one TC)
  - id: BE-INT-030
    description: the summary of a mixed run (precedence, untested, outside universe, diagnostics, three percentages) matches hand-computed numbers and survives later catalog changes; a run with nothing executed is 100% untested
  - id: BE-INT-031
    description: projects are created (key trimmed and upper-cased, duplicate key is a conflict), read by key or id, listed by key and updated; the database forbids deleting a project, changing its key, lowering its counter and invalid keys or names
  - id: BE-INT-032
    description: test case numbers are per project, contiguous and unique under concurrent creation; list, get and the ingestion view are scoped to the project
  - id: BE-INT-033
    description: ingestion into a project (?project=) snapshots that project's universe, correlates only its keys (another project's key is wrong_project), keeps externalRunId unique per project and filters run lists by project
  - id: BE-INT-034
    description: the projects migration keeps every existing test case as TC-<id>, continues the TC counter after the highest id and assigns existing runs to TC
  - id: BE-INT-035
    description: a project key lookup that fails after the test case query succeeded is reported as an error, never as a test case without key
  - id: BE-INT-036
    description: the first administrator is bootstrapped once; sign-in, session tokens and password changes (which sign other sessions out) work against Postgres; the database rejects invalid usernames, blank names, unhashed passwords, duplicates, deletes and username changes
  - id: BE-INT-037
    description: invitations store only the token digest, list newest first, are accepted once, revoke only while pending, and the database forbids deleting them or changing a settled one
  - id: BE-INT-038
    description: concurrent acceptances of one link create exactly one account, and one username is taken once across links
  - id: BE-INT-039
    description: project roles persist (granted by an invitation on accept, changed in place, removed), drive the guard (scope, required role, invisible projects) and the database rejects unknown roles, unknown projects and incomplete invitation grants
  - id: BE-INT-040
    description: test case, run and project lists are narrowed to the visible projects (every project, some, or none for a user without memberships)
  - id: BE-INT-041
    description: project API keys persist only their digest, authenticate (a use recorded at most once a minute), report runs into their own project only, stop at once when revoked, and the database forbids deleting or altering them
  - id: BE-INT-042
    description: test case versions are advanced by the database on every content or step change (not on a no-op save) and never go back; a stale If-Match is refused without changes, and of twenty concurrent writes from the same read exactly one wins
  - id: BE-INT-043
    description: snapshot amendments add reported TC-IDs to a run's universe without touching the snapshot (summary, run, list and history reflect it); of twenty concurrent amendments of one TC-ID exactly one is recorded; the database refuses TC-IDs without valid results or already in the snapshot and keeps amendments append-only
  - id: BE-INT-044
    description: retries - Surefire flaky and rerun attempts and the attempt/retry property are stored per result; the last attempt is the logical result (flaky when it passed after failing) in summary, run outcome, results (retried flag) and history
  - id: BE-INT-045
    description: taxonomy - every project (existing and new) gets the built-in dimensions and values; project dimensions and values conflict on duplicate keys, append in order and archive/restore; tags and classification advance the version (not on a no-op), honour If-Match, roll back with a failed write and keep archived values; tag and classification filters (AND) agree with counts; of twenty concurrent tag edits one wins; the database refuses cross-project or cross-dimension values, two values per dimension, malformed tags, deletes, key changes and moving dimensions
  - id: BE-INT-046
    description: taxonomy persistence failures propagate - a tags, classification or values table failing after the queries before it succeeded fails the read or write instead of returning a partial test case, list or dimension
  - id: BE-INT-047
    description: suites - static suites list deduplicated test cases of their project, query suites select by tag and classification; a run reported for a suite expects only the suite's active automated test cases (no untested noise; other results outside the universe), keeps the suite's name of that moment and is filtered by suite; archived suites take no runs (409), unknown ones are 404; the database refuses foreign test cases, members of query suites, deletes, key/kind changes, queries on static suites and changes to a run's suite
  - id: BE-INT-048
    description: manual runs - started by a member with the manual (or all) active test cases, results appended while running (re-tests are gapless next attempts even under twenty concurrent records, not flaky), finished as completed or cancelled and then closed; CI runs take no manual results; the database refuses results in finished or CI runs, reopening or changing a finished run's status, running batch runs, changing mode or starter, editing results and failed steps below 1
  - id: BE-INT-049
    description: requirements - native ones are numbered R-n per project, external ones keep their provider id (duplicates 409); imports create and update by external id, mark them synced and keep links; coverage reads the latest logical result of each covering test case (retries, variants) as not run, failing, passing or partial; lists are newest first and narrow to what a test case covers; the database refuses foreign test cases, deletes, provider/id changes, synced native requirements, unknown providers, non-http links and duplicates
  - id: BE-INT-050
    description: twenty concurrent native requirement creations in one project all succeed with distinct, gapless R-1..R-20 numbers (the project's requirement counter serializes them)
  - id: BE-INT-051
    description: issue verification on a real database - ten concurrent native issues get I-1..I-10; open + failing is a known issue (evidence run kept), a later skip is inconclusive and keeps it, a closing import with failing evidence is reopen, a pass on retry is validated fixed, a failing variant reopens it; reopening clears closedAt; lists filter by state and test case; the database refuses cross-project links, deletes, identity changes and inconsistent states
  - id: BE-INT-052
    description: project quality on a real database - automation rate over active test cases; never-executed and stale (older than staleDays) test cases, never first; flaky counts per test case over the latest window runs (a final failure is not flaky, manual re-tests never are), narrowed by window
  - id: BE-INT-053
    description: live runs on a real database - a live run starts with its snapshot (a retried start returns it), takes events idempotently by event id while running, shows provisional states; the final JUnit report completes it once (status, digest, results; replays change nothing) and the reconciliation reports what the events missed; the database refuses events of finished or batch runs, edits and deletes of events, and changing a digest once set
  - id: BE-INT-054
    description: OpenTelemetry on a real database - a JUnit ingestion is one trace whose root span carries the run id, created flag and result count, with a parse span and the database queries (otelpgx) as spans of the same trace; a failed ingestion's span has an error status
  - id: BE-INT-055
    description: webhooks on a real database - the signing secret is stored encrypted; a created batch run, a finished manual run and a live run completed by its report each queue one run.completed delivery (replays and paused webhooks none); deliveries are signed (HMAC verified by the receiver), marked succeeded once, retried with backoff on failure, leased so a second claim skips them, and twenty-plus deliveries under five concurrent workers are each sent exactly once (FOR UPDATE SKIP LOCKED); lookups of other projects' webhooks are not found; the database refuses unknown events, secrets or tokens in clear, non-http URLs and inconsistent delivery states
  - id: BE-INT-056
    description: GitHub connector on a real database - the token is stored encrypted and shown as a hint; a sync mirrors issues (not pull requests) by number with their state, a second sync updates them; a failed sync is recorded and keeps the last successful time; disconnecting keeps the mirrored issues; another secrets key cannot read the token (no hint, sync asks to connect again)
  - id: BE-INT-057
    description: audit log on a real database through the API - every successful authenticated change (projects, test cases, webhooks; ten concurrent creations) is one event with actor, route, path, project and status, refused changes and reads are not; events filter by project and actor; the database refuses updates, deletes and malformed events (empty actor, reads, failures, empty path)
  - id: BE-INT-058
    description: latest results cost - the latest statuses and the latest conclusive result of a test case whose only result is deep in history cost no more than those of a test case in the newest run (relative bound over 100,000 later results); the stale test case keeps its old result
  - id: BE-INT-059
    description: concurrent link replacements - twenty concurrent replacements of a requirement's, an issue's and a static suite's test cases, ten rounds each, always end as exactly one caller's set (never a union)
  - id: BE-INT-060
    description: concurrent taxonomy creations - ten concurrent dimension creations at the 30-dimension limit leave exactly 30; twenty concurrent value creations get distinct, gapless positions
  - id: BE-INT-061
    description: repeated names without an attempt signal are variants - the ingestion warns how many, a failed variant fails the test case in the summary, the latest conclusive status and the flaky ranking, both are listed and neither is a retry; a test that passed on a retry is not flaky when another variant of its test case failed for good
