  /api/v1/ingestion/junit:
    post:
      tags: [ingestion]
      operationId: ingestJUnitReport
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - cookieAuth: []
      summary: Ingest one complete JUnit XML report (batch) for a CI run attempt
      description: |
        CI authenticates with a project API key; people with a session need the
        `member` role in the project. A key reports into its own project only: it is
        the default `project`, and any other project answers 404.
        The run belongs to `project` (default: the API key's project, else `TC`): its expected universe is that
        project's, the testcase-name fallback only reads `<project>-<n>`, and a
        `tc-id` property with another project's key is a `wrong_project` diagnostic.
        `externalRunId` = `{provider}:{runId}:{runAttempt}`, unique per project. Re-sending the same
        attempt is idempotent (200, no duplicate run, no reprocessing; if the report
        content differs from the original, a `warnings` entry says it was not
        applied); a new
        attempt creates a new run (201). Individual invalid testcases never abort
        the batch: they are persisted with a correlation diagnostic, or reported in
        `parseErrors` (stored with the run; `persisted` tells whether the result
        was kept, e.g. with an unknown duration, or discarded, e.g. without name).
      parameters:
        - name: project
          in: query
          required: false
          description: Key of the project the run belongs to (default the API key's project, else `TC`).
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9]{1,9}$"
          example: CHK
        - name: suite
          in: query
          required: false
          description: |
            Key of the suite the run executed (partial run): the expected universe is the suite's active automated
            test cases instead of the whole project's; results outside it stay valid but outside the universe. An
            unknown suite is 404, an archived one 409.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,29}$"
          example: smoke
        - name: provider
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,49}$"
          example: github
        - name: runId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,100}$"
          example: "9876543210"
        - name: runAttempt
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 1
        - name: pipeline
          in: query
          required: false
          description: |
            Empty is the same as absent (a documented exception to "present but empty is a 400"): CI templates expand
            unset variables to empty, e.g. `branch=${GITHUB_HEAD_REF}` on a push build.
          schema:
            type: string
            maxLength: 200
        - name: branch
          in: query
          required: false
          description: |
            Empty is the same as absent (a documented exception to "present but empty is a 400"): CI templates expand
            unset variables to empty, e.g. `branch=${GITHUB_HEAD_REF}` on a push build.
          schema:
            type: string
            maxLength: 255
        - name: commit
          in: query
          required: false
          description: |
            Empty is the same as absent (a documented exception to "present but empty is a 400"): CI templates expand
            unset variables to empty, e.g. `branch=${GITHUB_HEAD_REF}` on a push build.
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          description: |
            How the CI execution ended (the run's `executionStatus`). `interrupted` or
            `cancelled` mark a run whose pipeline broke or was stopped, so its report may
            be incomplete and its untested test cases may simply not have run.
          schema:
            $ref: "#/components/schemas/ExecutionStatus"
        - name: shard
          in: query
          required: false
          description: |
            `i/N`: this report is shard `i` of the `N` (2 to 100) reports of one logical run (same provider, runId and
            runAttempt), e.g. a test matrix. The first shard creates the run (mode `sharded`, `executionStatus`
            `running`, its snapshot taken then); each shard adds its results once (201; re-sending a shard is a
            replay, 200); the run completes when every shard arrived (cancelled if a shard was, else interrupted if a
            shard was, else completed) and `run.completed` webhooks fire then, once. A different `N`, a shard for a
            run reported without shards (or the opposite) and a shard after the run ended are 409. To end a run whose
            shards will not all arrive, call `POST /api/v1/ingestion/finalize`.
          schema:
            type: string
            pattern: "^[0-9]{1,3}/[0-9]{1,3}$"
          example: 2/4
      requestBody:
        required: true
        description: |
          The JUnit XML document, uncompressed or gzip (`Content-Encoding: gzip`; the
          size limit applies to the decompressed report; a body that is not gzip, truncated or
          corrupt is an unreadable report, `400 invalid_junit`; any other encoding is a 415). `application/xml`, `text/xml` and any `+xml` media
          type are accepted. A `charset` parameter overrides the document's XML
          declaration (RFC 7303); UTF-8, US-ASCII, ISO-8859-1, windows-1252 and
          UTF-16 are supported, any other charset is a 415.
        content:
          application/xml:
            schema:
              type: string
              description: JUnit XML document (`<testsuites>` or `<testsuite>` root)
          text/xml:
            schema:
              type: string
              description: JUnit XML document (`<testsuites>` or `<testsuite>` root)
      responses:
        "201":
          description: New test run created and results persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
        "200":
          description: Idempotent replay; the existing run is returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/ingestion/finalize:
    post:
      tags: [ingestion]
      operationId: finalizeShardedRun
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - cookieAuth: []
      summary: End a sharded run whose missing shards will not arrive
      description: |
        For a CI job that runs after every shard (e.g. `if: always()`): a sharded run still waiting for shards ends as
        `interrupted`, its missing shards named in `warnings`, and `run.completed` webhooks fire. A run that already
        ended is returned unchanged (200); a run that is not sharded is 409. No request body; the run is identified
        like in the ingestion.
      parameters:
        - name: project
          in: query
          required: false
          description: Key of the project the run belongs to (default the API key's project, else `TC`).
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9]{1,9}$"
        - name: provider
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,49}$"
        - name: runId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,100}$"
        - name: runAttempt
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "201":
          description: The run was waiting for shards and ended as interrupted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
        "200":
          description: The run had already ended; returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: provenly_session
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: pvk_ project API key
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: pvly_pat_ personal access token (read-only)
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Optimistic locking: the `ETag` last read (or `*`). When it no longer matches the test case's
        version the write is refused with 412 and nothing changes. Without it the write always applies.
      schema:
        type: string
        example: '"7"'
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
      example: ana
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProjectKey:
      name: projectKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9]{1,9}$"
      example: CHK
    DimensionKey:
      name: dimensionKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,29}$"
      example: risk
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SuiteKey:
      name: suiteKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,29}$"
      example: smoke
    ValueKey:
      name: valueKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,29}$"
      example: critical
    ProjectFilter:
      name: project
      in: query
      required: false
      description: Only items of the project with this key (an unknown key is a 404).
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9]{1,9}$"
      example: CHK
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    TestCaseId:
      name: testCaseId
      in: path
      required: true
      description: Numeric TC-ID (without the `TC-` prefix)
      schema:
        type: integer
        format: int64
        minimum: 1
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TestRunId:
      name: testRunId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  headers:
    ETag:
      description: |
        The test case's version as an entity tag (e.g. `"7"`). It advances with every change to the
        test case or its steps; send it back in `If-Match` to write only if nobody saved in between.
      schema:
        type: string
        example: '"7"'
  responses:
    PreconditionFailed:
      description: The test case changed since the `If-Match` version was read; reload it and apply the change again
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: Invalid request (parameters, body or document)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session (missing, invalid or expired), or wrong username or password at sign-in
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in but not allowed (e.g. not an administrator, or a personal access token outside its projects or making a change)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state (e.g. a project key already in use)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds the allowed size
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Unsupported Content-Type
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency (the database) is unreachable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many failed sign-ins for this username; try again later (the detail says when)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: An external system (e.g. GitHub) failed or answered something unusable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          description: >-
            Stable machine-readable error code. Requests that match no operation get `not_found` (404), or
            `method_not_allowed` (405, with an `Allow` header) when the path exists for other methods.
          enum:
            - bad_request
            - validation_error
            - invalid_junit
            - not_found
            - conflict
            - unauthorized
            - forbidden
            - precondition_failed
            - method_not_allowed
            - payload_too_large
            - unsupported_media_type
            - service_unavailable
            - upstream_error
            - too_many_requests
            - internal_error
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    TestCaseStatus:
      type: string
      enum: [active, deprecated]

    TestCase:
      type: object
      additionalProperties: false
      required: [id, key, projectId, projectKey, number, title, description, expectedResult, status, automated, createdAt, updatedAt, version, tags, classification]
      properties:
        tags:
          type: array
          description: Free labels, lower-case and sorted.
          items:
            $ref: "#/components/schemas/Tag"
        classification:
          $ref: "#/components/schemas/Classification"
        version:
          type: integer
          format: int64
          minimum: 1
          description: Advances with every change to the test case, its steps, tags or classification; also sent as the `ETag` header.
          example: 7
        id:
          type: integer
          format: int64
          example: 153
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$"
          example: CHK-12
        projectId:
          type: integer
          format: int64
        projectKey:
          type: string
          example: CHK
        number:
          type: integer
          format: int64
          minimum: 1
          example: 12
        title:
          type: string
        description:
          type: string
        expectedResult:
          type: string
        status:
          $ref: "#/components/schemas/TestCaseStatus"
        automated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deprecatedAt:
          type: string
          format: date-time
          nullable: true

    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, isAdmin, createdAt, deactivatedAt]
      properties:
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
          description: When an administrator deactivated the user (null - active). A deactivated user cannot sign in.
        id:
          type: integer
          format: int64
        username:
          type: string
          example: ana
        displayName:
          type: string
          example: Ana Pérez
        email:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PasswordResetLink:
      type: object
      additionalProperties: false
      required: [username, token, expiresAt]
      properties:
        username:
          type: string
        token:
          type: string
          description: Shown once; the link is `/reset-password?token=<token>`.
        expiresAt:
          type: string
          format: date-time

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          description: At least 10 characters, at most 72 bytes.

    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    Session:
      type: object
      additionalProperties: false
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: "Signed session token (JWT); send it as `Authorization: Bearer <token>`"
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          description: 10 characters to 72 bytes

    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]

    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, note, status, createdBy, createdAt, expiresAt, acceptedAt, acceptedUserId, revokedAt, projectId, projectRole]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          nullable: true
        note:
          type: string
        status:
          $ref: "#/components/schemas/InvitationStatus"
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        acceptedUserId:
          type: integer
          format: int64
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        projectId:
          type: integer
          format: int64
          nullable: true
          description: The project the account joins on accept, if any
        projectRole:
          type: string
          nullable: true
          enum: [maintainer, member, viewer, null]

    InvitationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Invitation"

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          nullable: true
          description: Optional; becomes the account's email unless the person gives another
        note:
          type: string
          maxLength: 200
        project:
          type: string
          description: Key of a project the account joins on accept (with `role`)
        role:
          $ref: "#/components/schemas/ProjectRole"

    ProjectRole:
      type: string
      enum: [maintainer, member, viewer]

    Member:
      type: object
      additionalProperties: false
      required: [user, role, since]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/ProjectRole"
        since:
          type: string
          format: date-time

    MemberPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Member"

    SetMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"

    PersonalAccessToken:
      type: object
      additionalProperties: false
      required: [id, name, prefix, projects, status, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        prefix:
          type: string
          description: First characters of the token, to tell tokens apart (the token itself is never shown again).
          pattern: "^pvly_pat_[0-9a-f]{8}$"
        projects:
          type: array
          description: Keys of the projects the token reads.
          items:
            type: string
        status:
          type: string
          enum: [active, expired, revoked]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Last request made with the token (recorded at most once a minute).
        revokedAt:
          type: string
          format: date-time
          nullable: true

    PersonalAccessTokenPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PersonalAccessToken"

    CreatePersonalAccessTokenRequest:
      type: object
      additionalProperties: false
      required: [name, projects]
      properties:
        name:
          type: string
          description: What the token is for (e.g. a script or an MCP client); 1 to 100 characters.
          example: Claude Desktop
        projects:
          type: array
          description: Keys of 1 to 50 projects you belong to.
          minItems: 1
          maxItems: 50
          items:
            type: string
          example: [CHK]
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90

    CreatedPersonalAccessToken:
      type: object
      additionalProperties: false
      required: [personalAccessToken, token]
      properties:
        personalAccessToken:
          $ref: "#/components/schemas/PersonalAccessToken"
        token:
          type: string
          description: "The token: send it as `Authorization: Bearer <token>`. Shown only once."
          pattern: "^pvly_pat_[0-9a-f]{8}_[A-Za-z0-9_-]{43}$"

    ApiKey:
      type: object
      additionalProperties: false
      required: [id, name, prefix, status, createdBy, createdAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        prefix:
          type: string
          description: First characters of the key, to tell keys apart (the key itself is never shown again).
          pattern: "^pvk_[0-9a-f]{8}$"
        status:
          type: string
          enum: [active, revoked]
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Last report made with the key (recorded at most once a minute).
        revokedAt:
          type: string
          format: date-time
          nullable: true

    ApiKeyPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ApiKey"

    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: What the key is for (e.g. the CI pipeline); 1 to 100 characters.
          example: GitHub Actions

    CreatedApiKey:
      type: object
      additionalProperties: false
      required: [apiKey, token]
      properties:
        apiKey:
          $ref: "#/components/schemas/ApiKey"
        token:
          type: string
          description: "The key: send it as `Authorization: Bearer <token>`. Shown only once."
          pattern: "^pvk_[0-9a-f]{8}_[A-Za-z0-9_-]{43}$"

    CreatedInvitation:
      type: object
      additionalProperties: false
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: Shown only here; the link is `<web origin>/accept-invite#token=<token>` (in the fragment, never sent to a server)

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, username, displayName, password]
      properties:
        token:
          type: string
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{2,31}$"
          description: Stored lower-cased; 3 to 32 characters
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          nullable: true
        password:
          type: string
          minLength: 10

    Project:
      type: object
      additionalProperties: false
      required: [id, key, name, description, createdAt, updatedAt, myRole]
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
          example: CHK
        name:
          type: string
          example: Checkout
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        myRole:
          type: string
          enum: [admin, maintainer, member, viewer]
          description: What the signed-in user may do in this project

    ProjectPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Project"

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          description: 2 to 10 letters or digits, starting with a letter; stored upper-cased.
          example: CHK
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000

    TestCasePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TestCase"

    CreateTestCaseRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        project:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
          description: Key of the project the test case belongs to (default `TC`); it never changes.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        expectedResult:
          type: string
          maxLength: 10000
        automated:
          type: boolean
          default: false
        tags:
          type: array
          description: Free labels; trimmed, lower-cased and deduplicated by the server (at most 20).
          items:
            type: string
        classification:
          type: object
          description: Dimension key → value key; each must be an active value of an active dimension of the project.
          additionalProperties:
            type: string

    UpdateTestCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        expectedResult:
          type: string
          maxLength: 10000
        automated:
          type: boolean
        tags:
          type: array
          description: Replaces every tag; trimmed, lower-cased and deduplicated by the server (at most 20).
          items:
            type: string
        classification:
          type: object
          description: |
            Merged into the current classification: a dimension mapped to a value key takes it, one mapped to
            `null` loses its value, absent dimensions keep theirs. Archived values and dimensions cannot be newly
            assigned (sending the current value again is accepted).
          additionalProperties:
            type: string
            nullable: true

    Tag:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{0,39}$"
      example: smoke

    Classification:
      type: object
      description: Dimension key → value key of the test case (at most one value per dimension).
      additionalProperties:
        type: string
      example:
        risk: critical
        feature: payments

    Dimension:
      type: object
      additionalProperties: false
      required: [key, name, builtIn, archivedAt, values]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,29}$"
          description: Never changes.
          example: risk
        name:
          type: string
          example: Risk
        builtIn:
          type: boolean
          description: Seeded with every project (feature, component, level, depth, type, risk, platform).
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Archived dimensions keep their test case values but cannot be assigned.
        values:
          type: array
          items:
            $ref: "#/components/schemas/DimensionValue"

    DimensionValue:
      type: object
      additionalProperties: false
      required: [key, name, archivedAt]
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,29}$"
          description: Never changes.
          example: critical
        name:
          type: string
          example: Critical
        archivedAt:
          type: string
          format: date-time
          nullable: true

    DimensionList:
      description: A page of the project's dimensions (DEC-78; the list used to be unpaginated).
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dimension"

    CreateDimensionRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,29}$"
        name:
          type: string
          minLength: 1
          maxLength: 60

    CreateDimensionValueRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,29}$"
        name:
          type: string
          minLength: 1
          maxLength: 60

    UpdateDimensionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        archived:
          type: boolean
          description: true archives (idempotent), false restores.

    TestStep:
      type: object
      additionalProperties: false
      required: [id, testCaseId, position, action, expectedResult, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        testCaseId:
          type: integer
          format: int64
        position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based, contiguous order within the test case
        action:
          type: string
        expectedResult:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TestStepPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TestStep"

    TestStepList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TestStep"

    CreateTestStepRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 2000
        expectedResult:
          type: string
          maxLength: 2000
        position:
          type: integer
          format: int32
          minimum: 1
          description: Insert at this 1-based position (clamped to the end)

    UpdateTestStepRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 2000
        expectedResult:
          type: string
          maxLength: 2000

    ReorderTestStepsRequest:
      type: object
      additionalProperties: false
      required: [stepIds]
      properties:
        stepIds:
          type: array
          items:
            type: integer
            format: int64

    ExecutionStatus:
      type: string
      description: |
        How the CI execution ended, as reported by CI: `completed`, `interrupted` (the pipeline
        broke) or `cancelled` (it was stopped). It says nothing about test outcomes: see
        `TestRun.outcome.verdict`.
      enum: [completed, interrupted, cancelled]
      default: completed

    RunExecutionStatus:
      type: string
      description: |
        How the run's execution ended (`completed`, `interrupted`, `cancelled`), or `running` while a manual, live
        or sharded run still receives results.
      enum: [running, completed, interrupted, cancelled]

    RunVerdict:
      type: string
      description: |
        Derived from the run's summary (snapshot TC-IDs with their aggregated status):
        `no_tests` when the expected universe is empty; otherwise `failed` when any TC-ID
        failed or errored; otherwise `incomplete` when any is untested or skipped;
        otherwise `passed`.
      enum: [passed, failed, incomplete, no_tests]

    RunOutcome:
      type: object
      additionalProperties: false
      description: Test outcome of a run, from the same computation as its summary.
      required: [verdict, executed, passed, failed, error, skipped, untested, passRate, flaky]
      properties:
        flaky:
          type: integer
          format: int32
          minimum: 0
          description: TC-IDs that passed only on a retry (MVP D1); they count as passed.
        verdict:
          $ref: "#/components/schemas/RunVerdict"
        executed:
          type: integer
          format: int32
          description: Expected TC-IDs with at least one result
        passed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        error:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
        untested:
          type: integer
          format: int32
        passRate:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage of executed TC-IDs that passed; 0 when executed=0 (the UI shows —).

    TestRun:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - externalRunId
        - provider
        - providerRunId
        - runAttempt
        - pipeline
        - branch
        - commit
        - executionStatus
        - outcome
        - expectedCount
        - resultCount
        - amendmentCount
        - createdAt
        - suite
        - mode
        - startedBy
        - shards
      properties:
        mode:
          type: string
          enum: [batch, manual, live, sharded]
          description: |
            How the results arrive - one CI report (batch), recorded by people (manual), streamed (live) or one
            report per shard (sharded).
        shards:
          description: How far a sharded run got (null - not sharded).
          type: object
          nullable: true
          additionalProperties: false
          required: [total, received, missing]
          properties:
            total:
              type: integer
              format: int32
              minimum: 2
              maximum: 100
            received:
              type: array
              description: The shards that arrived, ascending.
              items:
                type: integer
                format: int32
            missing:
              type: array
              description: The shards that have not arrived, ascending (after a finalization, they never will).
              items:
                type: integer
                format: int32
        startedBy:
          type: string
          nullable: true
          description: Who started a manual run.
        suite:
          description: The suite the run was reported for, as named then (null - the project's automated catalog).
          type: object
          nullable: true
          additionalProperties: false
          required: [key, name]
          properties:
            key:
              type: string
              pattern: "^[a-z][a-z0-9-]{0,29}$"
            name:
              type: string
        amendmentCount:
          type: integer
          format: int32
          minimum: 0
          description: Amendments of the universe after creation (DEC-42); more than 0 marks the run as edited.
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        externalRunId:
          type: string
          example: github:9876543210:1
        provider:
          type: string
        providerRunId:
          type: string
        runAttempt:
          type: integer
          format: int32
        pipeline:
          type: string
        branch:
          type: string
        commit:
          type: string
        executionStatus:
          $ref: "#/components/schemas/RunExecutionStatus"
        outcome:
          $ref: "#/components/schemas/RunOutcome"
        expectedCount:
          type: integer
          format: int32
          description: Size of the immutable expected-universe snapshot
        resultCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    SuiteQuery:
      type: object
      additionalProperties: false
      properties:
        tag:
          type: string
          nullable: true
          description: Only test cases with this tag (normalized like tags).
        classification:
          type: array
          maxItems: 10
          description: dimension:value pairs that must all hold.
          items:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,29}:[a-z0-9][a-z0-9-]{0,29}$"

    Suite:
      type: object
      additionalProperties: false
      required: [key, name, description, kind, query, archivedAt, createdAt, updatedAt, caseCount]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,29}$"
          description: Never changes; CI reports a run for the suite with `?suite=<key>`.
          example: smoke
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [static, query]
          description: static lists its test cases; query selects them by tag and classification. Never changes.
        query:
          description: The selection of a query suite (null for static suites).
          type: object
          nullable: true
          additionalProperties: false
          required: [tag, classification]
          properties:
            tag:
              type: string
              nullable: true
            classification:
              type: array
              items:
                type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Archived suites keep their runs but receive no new ones (409).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        caseCount:
          type: integer
          format: int32
          description: Test cases a static suite lists (0 for query suites).
        testCaseIds:
          type: array
          description: The test cases a static suite lists (when reading one suite).
          items:
            type: integer
            format: int64

    SuiteList:
      description: A page of the project's suites (DEC-78; the list used to be unpaginated).
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Suite"

    CreateSuiteRequest:
      type: object
      additionalProperties: false
      required: [key, name, kind]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,29}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        kind:
          type: string
          enum: [static, query]
        query:
          $ref: "#/components/schemas/SuiteQuery"
        testCaseIds:
          type: array
          maxItems: 1000
          items:
            type: integer
            format: int64

    UpdateSuiteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        query:
          $ref: "#/components/schemas/SuiteQuery"
        archived:
          type: boolean

    SuiteCasesRequest:
      type: object
      additionalProperties: false
      required: [testCaseIds]
      properties:
        testCaseIds:
          type: array
          maxItems: 1000
          description: Every test case the static suite lists (replaces them).
          items:
            type: integer
            format: int64

    StartManualRunRequest:
      type: object
      additionalProperties: false
      required: [project, name]
      properties:
        project:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
        suite:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,29}$"
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: What is being tested (shown as the run's pipeline).
        scope:
          type: string
          enum: [manual, all]
          default: manual
          description: manual expects the active manual test cases; all every active test case.
        branch:
          type: string
          maxLength: 255
        commit:
          type: string
          maxLength: 64

    ManualResultRequest:
      type: object
      additionalProperties: false
      required: [testCaseId, status]
      properties:
        testCaseId:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ResultStatus"
        note:
          type: string
          maxLength: 10000
        failedStep:
          type: integer
          format: int32
          minimum: 1
          description: Only for a failed or error result.
        durationMs:
          type: integer
          format: int64
          minimum: 0

    FinishRunRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, cancelled]

    Requirement:
      type: object
      additionalProperties: false
      required: [id, provider, externalId, title, description, url, providerStatus, archivedAt, lastSyncedAt, createdAt, updatedAt, testCaseIds, coverage]
      properties:
        id:
          type: integer
          format: int64
        provider:
          $ref: "#/components/schemas/RequirementProvider"
        externalId:
          type: string
          description: The requirement's id in its provider (R-n for native ones). Never changes.
          example: PAY-123
        title:
          type: string
        description:
          type: string
        url:
          type: string
        providerStatus:
          type: string
          description: The status in the provider, as mirrored (free text).
        archivedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: When an import last mirrored it (null for native requirements).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        testCaseIds:
          type: array
          items:
            type: integer
            format: int64
        coverage:
          $ref: "#/components/schemas/Coverage"

    RequirementProvider:
      type: string
      enum: [provenly, jira, github, azure_devops]

    Coverage:
      type: object
      additionalProperties: false
      required: [status, linked, passed, failed, notRun, testCases]
      description: From the latest result of each covering test case (its logical status in the latest run with a result).
      properties:
        status:
          type: string
          enum: [uncovered, not_run, failing, partial, passing]
        linked:
          type: integer
          format: int32
        passed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
          description: Failed or errored in their latest result.
        notRun:
          type: integer
          format: int32
          description: Without a result yet, or skipped.
        testCases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [testCaseId, testCaseKey, status]
            properties:
              testCaseId:
                type: integer
                format: int64
              testCaseKey:
                type: string
                nullable: true
                description: Its key (CHK-4), so a list never shows a bare id (DEC-78).
              status:
                type: string
                nullable: true
                enum: [passed, failed, error, skipped, null]

    RequirementList:
      description: A page of the project's requirements (DEC-78; the list used to be unpaginated).
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items, coverageCounts]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Requirement"
            coverageCounts:
              type: object
              description: How many active requirements that match the filters (all pages, not only this one) have each coverage status.
              additionalProperties:
                type: integer
              example: { passing: 12, failing: 2, not_run: 3 }

    CreateRequirementRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        provider:
          $ref: "#/components/schemas/RequirementProvider"
        externalId:
          type: string
          description: Required for external providers; native ones are numbered by Provenly.
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 10000
        url:
          type: string
          maxLength: 2000
        providerStatus:
          type: string
          maxLength: 50

    ImportRequirementsRequest:
      type: object
      additionalProperties: false
      required: [provider, items]
      properties:
        provider:
          type: string
          enum: [jira, github, azure_devops]
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [externalId, title]
            properties:
              externalId:
                type: string
              title:
                type: string
              description:
                type: string
              url:
                type: string
              providerStatus:
                type: string

    ImportResult:
      type: object
      additionalProperties: false
      required: [created, updated]
      properties:
        created:
          type: integer
        updated:
          type: integer

    UpdateRequirementRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 10000
        url:
          type: string
          maxLength: 2000
        providerStatus:
          type: string
          maxLength: 50
        archived:
          type: boolean

    RequirementLinksRequest:
      type: object
      additionalProperties: false
      required: [testCaseIds]
      properties:
        testCaseIds:
          type: array
          maxItems: 1000
          items:
            type: integer
            format: int64

    Issue:
      type: object
      additionalProperties: false
      required: [id, provider, externalId, title, description, url, state, providerStatus, closedAt, lastSyncedAt, createdAt, updatedAt, testCaseIds, verification]
      properties:
        id:
          type: integer
          format: int64
        provider:
          $ref: "#/components/schemas/RequirementProvider"
        externalId:
          type: string
          description: The issue's id in its tracker (I-n for native ones). Never changes.
          example: PAY-123
        title:
          type: string
        description:
          type: string
        url:
          type: string
        state:
          $ref: "#/components/schemas/IssueState"
        providerStatus:
          type: string
          description: The status in the tracker, as mirrored (free text).
        closedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: When an import last mirrored it (null for native issues).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        testCaseIds:
          type: array
          items:
            type: integer
            format: int64
        verification:
          $ref: "#/components/schemas/Verification"

    IssueState:
      type: string
      enum: [open, closed]

    Verification:
      type: object
      additionalProperties: false
      required: [status, testCases]
      description: >-
        QA verification (DEC-8) from the issue's state and the latest conclusive result (passed, failed or error) of
        each linked test case; skipped results are inconclusive and keep the previous evidence. The issue's status is
        the worst of its test cases (reopen > known_issue > unverified > not_reproducible > validated_fixed).
      properties:
        status:
          type: string
          enum: [unlinked, unverified, known_issue, reopen, not_reproducible, validated_fixed]
        testCases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [testCaseId, testCaseKey, status, evidence, evidenceRunId, latestInconclusive]
            properties:
              testCaseId:
                type: integer
                format: int64
              testCaseKey:
                type: string
                nullable: true
                description: Its key (CHK-4), so a list never shows a bare id (DEC-78).
              status:
                type: string
                enum: [unverified, known_issue, reopen, not_reproducible, validated_fixed]
              evidence:
                type: string
                nullable: true
                enum: [passed, failed, error, null]
                description: The latest conclusive status of the test case.
              evidenceRunId:
                type: integer
                format: int64
                nullable: true
                description: The run the evidence comes from.
              latestInconclusive:
                type: boolean
                description: The latest result was skipped; the verification kept the previous evidence.

    IssueList:
      description: A page of the project's issues (DEC-78; the list used to be unpaginated).
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items, verificationCounts]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Issue"
            verificationCounts:
              type: object
              description: How many issues that match the filters (all pages, not only this one) have each verification status.
              additionalProperties:
                type: integer
              example: { known_issue: 2, validated_fixed: 5 }

    CreateIssueRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        provider:
          $ref: "#/components/schemas/RequirementProvider"
        externalId:
          type: string
          description: Required for external trackers; native issues are numbered by Provenly.
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 10000
        url:
          type: string
          maxLength: 2000
        state:
          $ref: "#/components/schemas/IssueState"
        providerStatus:
          type: string
          maxLength: 50

    ImportIssuesRequest:
      type: object
      additionalProperties: false
      required: [provider, items]
      properties:
        provider:
          type: string
          enum: [jira, github, azure_devops]
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [externalId, title, state]
            properties:
              externalId:
                type: string
              title:
                type: string
              description:
                type: string
              url:
                type: string
              state:
                $ref: "#/components/schemas/IssueState"
              providerStatus:
                type: string

    UpdateIssueRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 10000
        url:
          type: string
          maxLength: 2000
        state:
          $ref: "#/components/schemas/IssueState"
        providerStatus:
          type: string
          maxLength: 50

    IssueLinksRequest:
      type: object
      additionalProperties: false
      required: [testCaseIds]
      properties:
        testCaseIds:
          type: array
          maxItems: 1000
          items:
            type: integer
            format: int64

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actor, action, path, project, status, summary, testCase, ip, userAgent]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
          example: ana
        action:
          type: string
          description: Method and route of the operation.
          example: PATCH /api/v1/test-cases/{testCaseId}
        path:
          type: string
          example: /api/v1/test-cases/153
        project:
          type: string
          nullable: true
          description: >-
            The project the change addressed: its path or `?project=`, else the project its authorization allowed
            (a test case, a step, a run). Null when none.
        status:
          type: integer
          description: The HTTP status the request answered (2xx for changes; 401 or 429 for refused sign-ins).
        summary:
          type: string
          nullable: true
          description: What the change did, in words; null for events recorded before summaries existed.
          example: edited CHK-4 step 3
        testCase:
          type: string
          nullable: true
          description: The key of the test case the change touched, if any.
          example: CHK-4
        ip:
          type: string
          nullable: true
          description: >-
            The client's address: the peer, or the nearest X-Forwarded-For hop added by a proxy listed in
            PROVENLY_TRUSTED_PROXIES. Null for events recorded before it was kept.
          example: 198.51.100.7
        userAgent:
          type: string
          nullable: true
          description: The client's User-Agent (at most 500 characters).

    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"

    JsonRpcMessage:
      type: object
      description: A JSON-RPC 2.0 request, notification or response (MCP).
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          example: "2.0"
        id:
          description: Request id (string or number); absent in notifications.
        method:
          type: string
          example: tools/call
        params:
          type: object
          additionalProperties: true

    JsonRpcResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: The request's id (null when the request could not be read).
          nullable: true
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string

    WebhookEvent:
      type: string
      enum: [run.completed]

    DeliveryStatus:
      type: string
      enum: [pending, succeeded, failed]

    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, webhookId, event, status, attempts, nextAttemptAt, lastStatusCode, lastError, createdAt, completedAt, payload]
      properties:
        id:
          type: integer
          format: int64
        webhookId:
          type: integer
          format: int64
        event:
          type: string
          enum: [run.completed, ping]
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempts:
          type: integer
          description: Attempts made so far (at most 5).
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: When a pending delivery is attempted next; null once it succeeded or failed.
        lastStatusCode:
          type: integer
          nullable: true
          description: The HTTP status of the latest attempt; null before any or when the endpoint was unreachable.
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        payload:
          type: object
          additionalProperties: true
          description: The JSON body sent (`event`, `sentAt` and, for run.completed, `project` and the `run` as in getTestRun).

    WebhookDeliveryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WebhookDelivery"

    Webhook:
      type: object
      additionalProperties: false
      required: [id, url, events, active, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        active:
          type: boolean
          description: A paused webhook gets no new deliveries; pending ones fail.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastDelivery:
          description: The latest delivery; absent before the first one.
          allOf:
            - $ref: "#/components/schemas/WebhookDelivery"

    WebhookList:
      description: A page of the project's webhooks (DEC-78; the list used to be unpaginated).
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Webhook"

    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          maxLength: 2000
          example: https://hooks.example.com/provenly
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEvent"

    CreatedWebhook:
      type: object
      additionalProperties: false
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: The signing secret (whsec_...), shown only in this response.

    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          maxLength: 2000
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEvent"
        active:
          type: boolean

    GitHubConnection:
      type: object
      additionalProperties: false
      required: [repository, labels, tokenHint, lastSyncedAt, lastError, updatedAt]
      properties:
        repository:
          type: string
          example: acme/shop
        labels:
          type: string
          description: Comma-separated labels an issue must have to be mirrored; empty mirrors every issue.
        tokenHint:
          type: string
          description: An ellipsis followed by the token's last four characters (the ellipsis alone for tokens under 12 characters); empty when it cannot be decrypted (connect again with a token).
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
          description: Why the latest sync failed; null after a successful one.
        updatedAt:
          type: string
          format: date-time

    ConnectGitHubRequest:
      type: object
      additionalProperties: false
      required: [repository]
      properties:
        repository:
          type: string
          description: owner/name
        token:
          type: string
          maxLength: 500
          description: A token that can read the repository's issues; required to connect, omitted keeps the stored one.
        labels:
          type: string
          maxLength: 200

    ProjectQuality:
      type: object
      additionalProperties: false
      required: [testCases, execution, flaky]
      properties:
        testCases:
          type: object
          additionalProperties: false
          required: [active, automated, manual, automationRate]
          properties:
            active:
              type: integer
              format: int32
            automated:
              type: integer
              format: int32
            manual:
              type: integer
              format: int32
            automationRate:
              type: number
              format: double
              description: Percentage of active test cases that are automated (0 without active ones).
        execution:
          type: object
          additionalProperties: false
          required: [staleDays, neverExecuted, stale, testCases]
          properties:
            staleDays:
              type: integer
              format: int32
            neverExecuted:
              type: integer
              format: int32
              description: Active test cases without any valid result.
            stale:
              type: integer
              format: int32
              description: Active test cases whose latest valid result is older than staleDays.
            testCases:
              type: array
              maxItems: 20
              description: Never executed first, then the oldest.
              items:
                type: object
                additionalProperties: false
                required: [testCaseId, testCaseKey, lastExecutedAt]
                properties:
                  testCaseId:
                    type: integer
                    format: int64
                  testCaseKey:
                    type: string
                  lastExecutedAt:
                    type: string
                    format: date-time
                    nullable: true
        flaky:
          type: object
          additionalProperties: false
          required: [window, testCases]
          properties:
            window:
              type: integer
              format: int32
            testCases:
              type: array
              maxItems: 20
              description: Test cases that passed on a retry in some of the latest window runs, most flaky first.
              items:
                type: object
                additionalProperties: false
                required: [testCaseId, testCaseKey, runs]
                properties:
                  testCaseId:
                    type: integer
                    format: int64
                  testCaseKey:
                    type: string
                  runs:
                    type: integer
                    format: int32

    StartLiveRunRequest:
      type: object
      additionalProperties: false
      required: [provider, runId, runAttempt]
      properties:
        project:
          type: string
          description: The project key (default the API key's project, else TC).
        suite:
          type: string
        provider:
          type: string
        runId:
          type: string
        runAttempt:
          type: integer
          format: int32
          minimum: 1
        pipeline:
          type: string
        branch:
          type: string
        commit:
          type: string

    LiveEventsRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [eventId, sequence, type]
            properties:
              eventId:
                type: string
                pattern: "^[A-Za-z0-9._:-]{1,100}$"
                description: Identifies the event; a repeated delivery is skipped.
              sequence:
                type: integer
                format: int64
                minimum: 0
              type:
                type: string
                enum: [test.started, test.finished, step.started, step.completed, run.finished]
              testName:
                type: string
                maxLength: 1000
              testCase:
                type: string
                maxLength: 100
                description: The TC-ID the test declares (CHK-12, TC-12 or 12).
              status:
                type: string
                enum: [passed, failed, error, skipped]
                description: Required for test.finished, absent otherwise.
              occurredAt:
                type: string
                format: date-time
              attempt:
                type: integer
                format: int32
                minimum: 1
                maximum: 100
                description: The test's attempt (default 1); a retry is the next attempt, not a duplicate.

    LiveEventsResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicates]
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer

    LiveRun:
      type: object
      additionalProperties: false
      required: [reconciliation, events, lastSequence, runFinished, waiting, running, finished, testCases, mismatches]
      properties:
        reconciliation:
          type: string
          enum: [pending, consistent, mismatch]
          description: Pending while the run runs; then whether the live events agree with the final report.
        events:
          type: integer
          format: int32
        lastSequence:
          type: integer
          format: int64
          nullable: true
        runFinished:
          type: boolean
          description: The runner sent run.finished.
        waiting:
          type: integer
          format: int32
        running:
          type: integer
          format: int32
        finished:
          type: integer
          format: int32
        testCases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [testCaseId, testCaseKey, state]
            properties:
              testCaseId:
                type: integer
                format: int64
              testCaseKey:
                type: string
              state:
                type: string
                enum: [waiting, running, passed, failed, error, skipped]
        mismatches:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, testCaseId, testCaseKey, requestedTestCaseId, liveStatus, finalStatus]
            properties:
              kind:
                type: string
                enum: [status_mismatch, live_only, final_only, started_without_finished, duplicate, invalid_correlation]
              testCaseId:
                type: integer
                format: int64
                nullable: true
              testCaseKey:
                type: string
                nullable: true
              requestedTestCaseId:
                type: string
                nullable: true
              liveStatus:
                type: string
                nullable: true
              finalStatus:
                type: string
                nullable: true

    TestRunPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TestRun"

    ResultStatus:
      type: string
      enum: [passed, failed, error, skipped]

    Correlation:
      type: string
      description: Outcome of TC-ID extraction/validation for a result
      enum: [valid, missing, malformed, unknown, deprecated, wrong_project]

    TestResult:
      type: object
      additionalProperties: false
      required:
        - id
        - testRunId
        - testCaseId
        - testCaseKey
        - requestedTestCaseId
        - correlation
        - testName
        - className
        - suiteName
        - status
        - durationMs
        - errorMessage
        - errorDetails
        - createdAt
        - attempt
        - retried
        - recordedBy
        - failedStep
        - shard
      properties:
        shard:
          type: integer
          format: int32
          nullable: true
          description: The shard of a sharded run that reported the result (null otherwise).
        recordedBy:
          type: string
          nullable: true
          description: Who recorded a manual result (null for results reported by CI).
        failedStep:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: The step where a manual test failed, when the tester said so.
        attempt:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Which attempt of its test this result was (1 = first). Read from Surefire flaky/rerun elements or an `attempt`/`retry` testcase property.
        retried:
          type: boolean
          description: A later attempt of the same test exists in the run, so this result is not the test's logical result.
        id:
          type: integer
          format: int64
        testRunId:
          type: integer
          format: int64
        testCaseId:
          type: integer
          format: int64
          nullable: true
          description: Set when correlation is `valid` or `deprecated` (a result received after the test case was deprecated still belongs to its history)
        testCaseKey:
          type: string
          nullable: true
          description: Display key (`<projectKey>-<number>`) of the linked test case; null when not linked
          example: CHK-12
        requestedTestCaseId:
          type: string
          nullable: true
          description: Raw TC-ID reference as declared by the test (for diagnostics)
        correlation:
          $ref: "#/components/schemas/Correlation"
        testName:
          type: string
        className:
          type: string
        suiteName:
          type: string
        status:
          $ref: "#/components/schemas/ResultStatus"
        durationMs:
          type: integer
          format: int64
          nullable: true
          description: |
            Milliseconds, rounded from the JUnit `time` attribute (seconds). 0 means
            reported as 0 or under 0.5 ms; null means not reported or invalid.
        errorMessage:
          type: string
        errorDetails:
          type: string
        createdAt:
          type: string
          format: date-time

    TestResultPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TestResult"

    TestCaseResult:
      type: object
      additionalProperties: false
      description: A historical result of a TC-ID plus the metadata observed at execution time
      required: [result, run]
      properties:
        result:
          $ref: "#/components/schemas/TestResult"
        run:
          $ref: "#/components/schemas/TestRun"

    TestCaseResultPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TestCaseResult"

    SummaryStatus:
      type: string
      enum: [untested, passed, failed, error, skipped]

    StatusCounts:
      type: object
      additionalProperties: false
      required: [untested, passed, failed, error, skipped]
      properties:
        untested:
          type: integer
          format: int32
        passed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        error:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32

    StatusPercentages:
      type: object
      additionalProperties: false
      description: Percentages of the expected test cases per status; all 0 when the run expects none (expectedTotal=0).
      required: [untested, passed, failed, error, skipped]
      properties:
        untested:
          type: number
        passed:
          type: number
        failed:
          type: number
        error:
          type: number
        skipped:
          type: number

    ExecutedPercentages:
      type: object
      additionalProperties: false
      description: Percentages of the executed test cases per status; all 0 when none was executed (executedTotal=0).
      required: [passed, failed, error, skipped]
      properties:
        passed:
          type: number
        failed:
          type: number
        error:
          type: number
        skipped:
          type: number

    DiagnosticCounts:
      type: object
      additionalProperties: false
      required: [missing, malformed, unknown, deprecated, wrongProject, total]
      properties:
        wrongProject:
          type: integer
          format: int32
          description: References with another project's key (not correlated)
        missing:
          type: integer
          format: int32
        malformed:
          type: integer
          format: int32
        unknown:
          type: integer
          format: int32
        deprecated:
          type: integer
          format: int32
        total:
          type: integer
          format: int32

    TestCaseOutcome:
      type: object
      additionalProperties: false
      required: [testCaseId, testCaseKey, status, resultCount, flaky]
      properties:
        flaky:
          type: boolean
          description: One of its tests passed on a retry after failed attempts (MVP D1).
        testCaseId:
          type: integer
          format: int64
        testCaseKey:
          type: string
          example: CHK-12
        status:
          $ref: "#/components/schemas/SummaryStatus"
        resultCount:
          type: integer
          format: int32

    Amendment:
      type: object
      additionalProperties: false
      required: [id, testRunId, testCaseId, testCaseKey, amendedBy, amendedByUsername, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
        testRunId:
          type: integer
          format: int64
        testCaseId:
          type: integer
          format: int64
        testCaseKey:
          type: string
        amendedBy:
          type: integer
          format: int64
        amendedByUsername:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 500
        createdAt:
          type: string
          format: date-time

    AmendmentPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Amendment"

    CreateAmendmentRequest:
      type: object
      additionalProperties: false
      required: [testCaseId, reason]
      properties:
        testCaseId:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          description: Why the TC-ID belongs in this run's universe (1 to 500 characters).

    TestRunSummary:
      type: object
      additionalProperties: false
      description: |
        Computed against the run's immutable expected-universe snapshot.
        Percentages are 0..100 with 6 decimals (0 when the denominator is 0);
        clients round them for display and compute totals from these precise values.
        Results with an invalid TC-ID are excluded and reported in `diagnostics`.
        Valid results for test cases outside the snapshot (e.g. automated=false)
        are excluded and counted in `outsideUniverse`, unless a maintainer amended
        them into the universe (`amendedTestCaseIds`, DEC-42).
      required:
        - testRunId
        - expectedTotal
        - executedTotal
        - counts
        - percentOfExpected
        - percentOfExecuted
        - executionPercent
        - diagnostics
        - outsideUniverse
        - outsideUniverseTestCaseIds
        - testCases
        - snapshotTotal
        - flaky
        - amendedTestCaseIds
      properties:
        flaky:
          type: integer
          format: int32
          minimum: 0
          description: TC-IDs of the universe that passed only on a retry (MVP D1).
        snapshotTotal:
          type: integer
          format: int32
          minimum: 0
          description: Size of the snapshot frozen at creation; `expectedTotal` adds the amendments.
        amendedTestCaseIds:
          type: array
          description: TC-IDs added to the universe after creation (DEC-42), ascending.
          items:
            type: integer
            format: int64
        testRunId:
          type: integer
          format: int64
        expectedTotal:
          type: integer
          format: int32
        executedTotal:
          type: integer
          format: int32
        counts:
          $ref: "#/components/schemas/StatusCounts"
        percentOfExpected:
          $ref: "#/components/schemas/StatusPercentages"
        percentOfExecuted:
          $ref: "#/components/schemas/ExecutedPercentages"
        executionPercent:
          type: number
          description: Executed test cases as a percentage of the expected ones; 0 when expectedTotal=0.
        diagnostics:
          $ref: "#/components/schemas/DiagnosticCounts"
        outsideUniverse:
          type: integer
          format: int32
          description: Valid results whose test case was not in the snapshot (e.g. automated=false at run creation)
        outsideUniverseTestCaseIds:
          type: array
          description: Distinct TC-IDs behind `outsideUniverse`, so the UI can warn and offer to mark them automated
          items:
            type: integer
            format: int64
        testCases:
          type: array
          description: Aggregated status per TC-ID of the snapshot (failed > error > skipped > passed; untested when no result)
          items:
            $ref: "#/components/schemas/TestCaseOutcome"

    IngestionDiagnostic:
      type: object
      additionalProperties: false
      required: [testName, correlation, requestedTestCaseId, message]
      properties:
        testName:
          type: string
        correlation:
          type: string
          enum: [missing, malformed, unknown, deprecated, wrong_project]
        requestedTestCaseId:
          type: string
          nullable: true
        message:
          type: string

    ParseError:
      type: object
      additionalProperties: false
      required: [index, testName, message, persisted, severity, shard]
      properties:
        shard:
          type: integer
          format: int32
          nullable: true
          description: The shard of a sharded run whose report it belongs to (null otherwise).
        index:
          type: integer
          format: int32
          description: 0-based position of the testcase in document order (in its shard's report)
        testName:
          type: string
        message:
          type: string
        persisted:
          type: boolean
          description: true when the result was still stored (e.g. invalid time), false when it was discarded
        severity:
          type: string
          enum: [error, warning]
          description: |
            error = data was lost or is unknown (no name, invalid time);
            warning = stored but worth reviewing (a passed/failed test with a 0 ms duration)

    ParseErrorPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ParseError"

    IngestionResponse:
      type: object
      additionalProperties: false
      required: [created, testRun, received, persisted, diagnostics, parseErrors, warnings]
      properties:
        created:
          type: boolean
          description: false when the request was an idempotent replay
        testRun:
          $ref: "#/components/schemas/TestRun"
        received:
          type: integer
          format: int32
          description: testcase elements found in the document
        persisted:
          type: integer
          format: int32
          description: results stored for the run
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/IngestionDiagnostic"
        parseErrors:
          type: array
          items:
            $ref: "#/components/schemas/ParseError"
        warnings:
          type: array
          description: |
            Non-blocking notices. On an idempotent replay whose report differs
            (SHA-256) from the one that created the run, it says the new report
            was not applied (send a new runAttempt to record it); likewise when
            the replay reports another status, pipeline, branch or commit. On a
            new run, it says when the report's suite timestamp is later than the
            ingestion or cannot be read (startedAt is then left unknown).
          items:
            type: string
