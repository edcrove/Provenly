# Local infrastructure for the POC: PostgreSQL only (no auth, no queues).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provenly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provenly}
      POSTGRES_DB: ${POSTGRES_DB:-provenly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-provenly}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
