  /api/v1/test-cases:
    get:
      tags: [test-cases]
      operationId: listTestCases
      summary: List test cases (newest id first)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TestCaseStatus"
        - $ref: "#/components/parameters/ProjectFilter"
        - name: tag
          in: query
          required: false
          description: Only test cases with this tag.
          schema:
            $ref: "#/components/schemas/Tag"
        - name: classification
          in: query
          required: false
          description: Up to 10 comma-separated `dimension:value` pairs that must all hold.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,29}:[a-z0-9][a-z0-9-]{0,29}(,[a-z][a-z0-9-]{0,29}:[a-z0-9][a-z0-9-]{0,29}){0,9}$"
          example: risk:critical,feature:payments
        - name: suite
          in: query
          required: false
          description: Only the test cases of this suite of `project` (needs `project`; not combined with tag or classification).
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,29}$"
        - name: q
          in: query
          required: false
          description: >-
            Text the title contains (any case), or a key or number (CHK-12, chk-12 or 12): what a test case picker
            searches with (DEC-78). At most 200 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: key
          in: query
          required: false
          description: |
            The test case with this exact key (`<PROJECT>-<number>`, e.g. `CHK-12`): a page of zero or one item, for
            callers that know the key but not the numeric id (MCP agents, scripts). Combinable with the other filters
            (`project` naming another project gives no item); a key of a project you cannot see gives no item.
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]{0,17}$"
          example: CHK-12
      responses:
        "200":
          description: Page of test cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCasePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
