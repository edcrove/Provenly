# Provenly: the whole stack with one command.
#
#   docker compose up -d                         # demo environment (defaults below)
#   docker compose --env-file envs/qa.env up -d  # or: make up ENV=qa
#
# Each environment (demo, qa, prod) is its own compose project (provenly-<env>)
# with its own volume and ports, so they can run side by side and their data
# persists across `down`/`up`. Only `down -v` (or `make db-reset`) deletes it.
#
# Start order: postgres (healthy) -> seed (restores a snapshot into an EMPTY
# database, once) -> migrate (goose up) -> api (healthy) -> web.
name: provenly-${PROVENLY_ENV:-demo}

x-db: &db
  POSTGRES_USER: ${POSTGRES_USER:-provenly}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provenly}
  POSTGRES_DB: ${POSTGRES_DB:-provenly}

x-api-build: &api-build
  context: ./backend
  target: runtime
  secrets: [extra_ca]
  args: { EXTRA_CA_ID: "${EXTRA_CA_ID:-none}", VERSION: "${IMAGE_TAG:-dev}" }

x-app-env: &app-env
  PROVENLY_ENV: ${PROVENLY_ENV:-demo}
  PROVENLY_DATABASE_URL: postgres://${POSTGRES_USER:-provenly}:${POSTGRES_PASSWORD:-provenly}@postgres:5432/${POSTGRES_DB:-provenly}?sslmode=disable
  PROVENLY_LOG_LEVEL: ${PROVENLY_LOG_LEVEL:-info}
  PROVENLY_MAX_INGEST_BYTES: ${PROVENLY_MAX_INGEST_BYTES:-10485760}
  PROVENLY_JWT_SECRET: ${PROVENLY_JWT_SECRET:-}
  PROVENLY_SECRETS_KEY: ${PROVENLY_SECRETS_KEY:-}
  PROVENLY_WEBHOOKS_ALLOW_PRIVATE: ${PROVENLY_WEBHOOKS_ALLOW_PRIVATE:-}
  PROVENLY_GITHUB_API_URL: ${PROVENLY_GITHUB_API_URL:-}
  PROVENLY_WEBHOOK_DELIVERY_RETENTION_DAYS: ${PROVENLY_WEBHOOK_DELIVERY_RETENTION_DAYS:-}
  PROVENLY_TRUSTED_PROXIES: ${PROVENLY_TRUSTED_PROXIES:-}
  # OpenTelemetry: set an OTLP/HTTP endpoint (e.g. http://collector:4318) to export traces. The SDK's standard
  # variables pass through (a hosted collector needs its headers; empty ones mean the SDK defaults).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  # The demo administrator when the env file does not say (an empty value, as in prod.env.example, means none).
  PROVENLY_ADMIN_USERNAME: ${PROVENLY_ADMIN_USERNAME-admin}
  PROVENLY_ADMIN_PASSWORD: ${PROVENLY_ADMIN_PASSWORD-provenly-demo}

services:
  postgres:
    image: postgres:16-alpine
    environment: *db
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  seed:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/scripts/seed.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-provenly}
      PGPASSWORD: ${POSTGRES_PASSWORD:-provenly}
      PGDATABASE: ${POSTGRES_DB:-provenly}
      SEED: ${SEED-demo}
    volumes:
      - ./seeds:/seeds:ro
      - ./scripts/db:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    image: ${IMAGE_PREFIX:-}provenly-api:${IMAGE_TAG:-local}
    build: *api-build
    command: ["migrate", "up"]
    environment: *app-env
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ${IMAGE_PREFIX:-}provenly-api:${IMAGE_TAG:-local}
    build: *api-build
    environment: *app-env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-}provenly-web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      target: runtime
      secrets: [extra_ca]
      args: { EXTRA_CA_ID: "${EXTRA_CA_ID:-none}" }
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Scheduled backups (card #63), only with the `backup` profile: `docker compose --profile backup up -d` (or
  # `make up ENV=prod` with COMPOSE_PROFILES=backup in the env file). pg_dump -Fc into BACKUP_DIR on BACKUP_SCHEDULE
  # (cron, UTC), keeping BACKUP_RETENTION_DAYS; healthy while the last success is recent. See docs/self-hosting.md.
  backup:
    image: postgres:16-alpine
    profiles: [backup]
    entrypoint: ["/bin/sh", "/opt/backup/entrypoint.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-provenly}
      PGPASSWORD: ${POSTGRES_PASSWORD:-provenly}
      PGDATABASE: ${POSTGRES_DB:-provenly}
      PROVENLY_ENV: ${PROVENLY_ENV:-demo}
      BACKUP_DIR: /backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-17 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup:/opt/backup:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/backup/healthy.sh"]
      interval: 1m
      timeout: 5s
      start_period: 2m
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

# Optional CA for builds behind a TLS-intercepting proxy (EXTRA_CA_CERT=<pem path>). Without one, an empty file in
# the repo: newer Docker Compose releases ask for an extra entitlement to read a secret outside the project (/dev/null).
secrets:
  extra_ca:
    file: ${EXTRA_CA_CERT:-./envs/no-extra-ca.pem}
