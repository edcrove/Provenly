# Frontend Integration inventory: components rendered against the API mocked
# with MSW (Vitest + Testing Library). Every UI surface (.tsx under src/app,
# src/features, src/components except vendored ui/) must be referenced by at
# least one target; a new component without a target is reported as a gap.
targets:
  - id: FE-INT-001
    description: application shell, navigation, index redirect and not-found page
    surfaces: [src/app/Layout.tsx, src/app/routes.tsx, src/app/NotFoundPage.tsx]
  - id: FE-INT-002
    description: test case list with status filter, pagination and empty state
    surfaces: [src/features/test-cases/TestCaseListPage.tsx, src/components/Pagination.tsx]
  - id: FE-INT-003
    description: create a test case (TC-ID from the backend), API validation errors, cancel
    surfaces: [src/features/test-cases/NewTestCasePage.tsx, src/features/test-cases/TestCaseForm.tsx]
  - id: FE-INT-004
    description: test case detail distinguishes current definition from observed execution metadata; edit keeps the TC-ID
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx, src/features/test-cases/TestCaseForm.tsx]
  - id: FE-INT-005
    description: deprecate with confirmation, reactivate, and error reporting
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx]
  - id: FE-INT-006
    description: steps management (add, edit, cancel, delete, move up/down, empty and error states)
    surfaces: [src/features/test-cases/StepsEditor.tsx]
  - id: FE-INT-007
    description: execution history of a TC-ID across runs with observed metadata (executed and reported dates), pagination
    surfaces: [src/features/test-cases/TestCaseHistory.tsx]
  - id: FE-INT-008
    description: test run list with verdict, pass rate, outcome breakdown, execution status, metadata, empty state and pagination
    surfaces: [src/features/test-runs/TestRunListPage.tsx]
  - id: FE-INT-009
    description: test run detail with verdict, pass rate, metadata and summary (counts, the three percentages, pass rate, untested links)
    surfaces: [src/features/test-runs/TestRunDetailPage.tsx, src/features/test-runs/RunSummary.tsx, src/components/StatusBadge.tsx]
  - id: FE-INT-010
    description: TC-ID diagnostics (missing/malformed/unknown/deprecated) and outside-universe test cases with "mark as automated"
    surfaces: [src/features/test-runs/RunDiagnostics.tsx]
  - id: FE-INT-011
    description: individual run results filtered by status and correlation, TC-ID links, pagination
    surfaces: [src/features/test-runs/RunResults.tsx, src/components/StatusBadge.tsx]
  - id: FE-INT-012
    description: API failures and not-found resources are surfaced as error alerts
    surfaces: [src/components/QueryState.tsx]
  - id: FE-INT-013
    description: the app boots with its providers and browser router
    surfaces: [src/app/App.tsx]
  - id: FE-INT-014
    description: a manual test case that receives automated results shows a warning and can be marked automated
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx]
  - id: FE-INT-015
    description: report parse errors (kept/discarded) on the run detail and unknown vs sub-millisecond durations
    surfaces: [src/features/test-runs/RunParseErrors.tsx]
  - id: FE-INT-016
    description: runs whose CI execution was interrupted or cancelled are flagged as possibly incomplete
    surfaces: [src/features/test-runs/TestRunDetailPage.tsx, src/features/test-runs/TestRunListPage.tsx]
  - id: FE-INT-017
    description: every page has a single h1, real section headings (h2) and its own browser tab title
    surfaces: [src/components/PageTitle.tsx, src/components/ui/card.tsx]
  - id: FE-INT-018
    description: >-
      double submits send one request, a page past the end moves to the last page, filtered empty states,
      invalid ids are not found without calling the API, and loading/error pages set the tab title
    surfaces:
      [
        src/api/queries.ts,
        src/components/Pagination.tsx,
        src/components/QueryState.tsx,
        src/features/test-cases/TestCaseListPage.tsx,
        src/features/test-cases/TestCaseDetailPage.tsx,
        src/features/test-runs/TestRunListPage.tsx,
        src/features/test-runs/TestRunDetailPage.tsx,
        src/features/test-runs/RunResults.tsx,
      ]
  - id: FE-INT-019
    description: >-
      step editor feedback: a rejected step keeps what was typed, only the latest action's error is shown (a later
      success clears it), and a failed step action refetches the possibly stale list
    surfaces: [src/features/test-cases/StepsEditor.tsx]
  - id: FE-INT-020
    description: the step editor at its limits - 100 steps rendered, the last one moved up, an expected result cleared by editing
    surfaces: [src/features/test-cases/StepsEditor.tsx]
  - id: FE-INT-021
    description: a result's full error details (stack trace, every failure of the testcase) expand on demand with an accessible toggle
    surfaces: [src/features/test-runs/RunResults.tsx]
  - id: FE-INT-022
    description: the projects page lists projects, creates one (it becomes the current project), reports a key in use, renames with cancel and error, and paginates
    surfaces: [src/features/projects/ProjectsPage.tsx]
  - id: FE-INT-023
    description: the header's current project narrows test case and run lists (remembered in the browser; an unknown remembered key means every project) and runs show their project key
    surfaces: [src/features/projects/ProjectSwitcher.tsx, src/features/projects/ProjectProvider.tsx, src/app/Layout.tsx, src/features/test-runs/TestRunListPage.tsx, src/features/test-cases/TestCaseListPage.tsx]
  - id: FE-INT-024
    description: a new test case is created in the chosen project (default the current one) and numbered with its key; an unknown project is reported
    surfaces: [src/features/test-cases/NewTestCasePage.tsx]
  - id: FE-INT-025
    description: run results show the test case key the API resolves (another project's key included), the id when there is none, and wrong_project diagnostics
    surfaces: [src/features/test-runs/RunResults.tsx, src/features/test-runs/RunDiagnostics.tsx, src/features/test-runs/RunSummary.tsx]
  - id: FE-INT-026
    description: without a session every page sends to sign-in and returns to the page asked for (never to another origin); wrong passwords are reported; sign-out and an expired session go back to sign-in; an unknown identity error is shown
    surfaces: [src/features/auth/LoginPage.tsx, src/app/Layout.tsx]
  - id: FE-INT-027
    description: administrators list users and create (copy) and revoke invitation links, with errors and pagination; members see no Users page
    surfaces: [src/features/auth/UsersPage.tsx]
  - id: FE-INT-028
    description: an invitation link creates the account (passwords must match) and signs the new user in; taken or invalid usernames and used or token-less links are reported
    surfaces: [src/features/auth/AcceptInvitePage.tsx]
  - id: FE-INT-029
    description: the account page shows who is signed in and changes the password (mismatch and wrong current password reported)
    surfaces: [src/features/auth/AccountPage.tsx]
  - id: FE-INT-030
    description: each role sees only its actions - viewers read (no edit, deprecate, steps editing, new test case, rename, mark automated), members edit and create in their projects, maintainers deprecate and rename; projects without a role do not show
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx, src/features/test-cases/StepsEditor.tsx, src/features/projects/ProjectsPage.tsx, src/features/test-runs/RunDiagnostics.tsx]
  - id: FE-INT-031
    description: project members - administrators and maintainers add (unknown users reported), change and remove members; viewers see the list without controls; pagination and unknown projects
    surfaces: [src/features/projects/ProjectMembersPage.tsx]
  - id: FE-INT-032
    description: an invitation can grant a project role, shown in the invitation list
    surfaces: [src/features/auth/UsersPage.tsx]
