openapi: 3.0.3
info:
  title: Provenly API
  version: 0.1.0
  description: |
    Public REST contract of the Provenly POC. This file is the authoritative
    inventory of public operations: backend Contract coverage and the frontend
    generated client are both derived from it.

    Conventions:
    - Errors: every non-2xx response uses `application/problem+json` with the
      `Problem` schema (RFC 9457 shape plus a machine-readable `code`).
    - Pagination: every listing endpoint accepts `page` (1-based) and `pageSize`
      (1..100, default 20) and returns `items` plus `page`, `pageSize`,
      `totalItems` and `totalPages`.
    - Authentication: every operation needs a session except health, readiness,
      sign-in, sign-out and accepting an invitation. A session is the token
      returned by sign-in, sent as `Authorization: Bearer <token>` or, from a
      browser, the HttpOnly `provenly_session` cookie set by sign-in. Without one
      the answer is 401. CI reports runs with a project API key instead
      (`Authorization: Bearer pvk_...`), which opens ingestion only.
    - Roles: administrators see and do everything. Everyone else works in the
      projects they are members of, as `maintainer` (manages the project, its
      members and deprecations), `member` (creates and edits test cases and
      steps) or `viewer` (read only). Anything in a project the user is not a
      member of answers 404, as if it did not exist; too low a role answers 403.
    - Projects: every test case and run belongs to a project with a key of 2 to 10
      upper-case letters or digits (e.g. `CHK`). The default project `TC` holds the
      test cases created before projects existed. Projects are never deleted and
      their key never changes.
    - Tracing: every response carries `X-Trace-Id`, the OpenTelemetry trace of the
      request; a W3C `traceparent` request header is continued.
    - Test Case identity: numeric `id` (used in URLs) plus a per-project `number`,
      displayed as `key` = `<projectKey>-<number>` (e.g. `CHK-12`). Both are
      assigned by the server, immutable and never reused.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - cookieAuth: []
  - personalAccessToken: []
tags:
  - name: system
  - name: auth
  - name: users
  - name: projects
  - name: test-cases
  - name: test-steps
  - name: test-runs
  - name: requirements
  - name: issues
  - name: insights
  - name: integrations
  - name: agents
  - name: audit
  - name: ingestion
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      security: []
      summary: Readiness check (the database is reachable)
      responses:
        "200":
          description: Service can serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Sign in with a username and password
      description: Returns a session token and sets it as the HttpOnly `provenly_session` cookie (SameSite=Strict).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      summary: Sign out (clears the session cookie)
      responses:
        "204":
          description: Signed out

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the signed-in user's password; every other session is signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; a fresh session is returned and set as cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/tokens:
    get:
      tags: [auth]
      operationId: listPersonalAccessTokens
      summary: List the signed-in person's personal access tokens, newest first
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of tokens (never the tokens themselves)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessTokenPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [auth]
      operationId: createPersonalAccessToken
      summary: Create a read-only personal access token over some of your projects (card #62)
      description: >-
        For scripts and MCP clients: send it as `Authorization: Bearer <token>`. It reads (GET and MCP) the projects it
        names, with the person's role there, and nothing else: a change, an administration route or another project
        answers 403; an expired or revoked token, or one of a deactivated person, 401. It always expires (default 90
        days, at most 365) and is returned once; only its digest is kept. Creating one needs a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalAccessTokenRequest"
      responses:
        "201":
          description: The token and its secret (shown only now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPersonalAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/tokens/{tokenId}/revoke:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [auth]
      operationId: revokePersonalAccessToken
      summary: Revoke one of your personal access tokens at once
      responses:
        "200":
          description: The revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users by username (administrators)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{username}/deactivate:
    post:
      tags: [users]
      operationId: deactivateUser
      summary: Deactivate a user (administrators)
      description: |
        The user's sessions are refused from their next request and they cannot sign in (the same answer as a wrong
        password); their pending password reset links stop working. Project API keys belong to their project and keep
        working. Nobody deactivates themselves (409) and the last active administrator stays (409). Deactivating a
        deactivated user changes nothing.
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{username}/reactivate:
    post:
      tags: [users]
      operationId: reactivateUser
      summary: Reactivate a deactivated user (administrators)
      description: |
        The user can sign in again with their password (or a new reset link). Reactivating an active user changes
        nothing.
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{username}/password-reset:
    post:
      tags: [users]
      operationId: createPasswordReset
      summary: Make a single-use password reset link for a user (administrators)
      description: |
        The token is shown once (only its digest is stored) and works for 24 hours, once; a new link voids the user's
        earlier ones. A deactivated user gets none (409). The person opens `/reset-password?token=...` and chooses a
        new password, which signs every older session of theirs out.
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "201":
          description: The link's token, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/password-reset:
    post:
      tags: [users]
      operationId: resetPassword
      security: []
      summary: Set a new password with a reset link and sign in
      description: |
        A link that is unknown, expired, already used or of a deactivated user is the same 404. Older sessions end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password set and signed in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations:
    get:
      tags: [users]
      operationId: listInvitations
      summary: List invitations, newest first (administrators)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of invitations (never their tokens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [users]
      operationId: createInvitation
      summary: Create a single-use invitation link (administrators); the token is shown only in this response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/{invitationId}/revoke:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [users]
      operationId: revokeInvitation
      summary: Revoke a pending invitation (administrators)
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/accept:
    post:
      tags: [users]
      operationId: acceptInvitation
      security: []
      summary: Create an account from an invitation link and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "201":
          description: Account created and signed in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects (by key)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project. The key is trimmed and upper-cased; it can never change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{projectKey}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project by its key
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Edit a project's name or description (the key never changes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{projectKey}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listProjectMembers
      summary: List a project's members by username (anyone who can see the project)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{projectKey}/members/{username}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/Username"
    put:
      tags: [projects]
      operationId: setProjectMember
      summary: Add a user to the project or change their role (maintainers and administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRequest"
      responses:
        "200":
          description: The membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [projects]
      operationId: removeProjectMember
      summary: Remove a user from the project (maintainers and administrators)
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{projectKey}/api-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listApiKeys
      summary: List the project's API keys, newest first (maintainers and administrators)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of API keys (never the keys themselves)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [projects]
      operationId: createApiKey
      summary: Create an API key for CI to report runs into this project (maintainers and administrators)
      description: The key is returned once and never stored; only its digest is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: The key and its token (shown only now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{projectKey}/api-keys/{apiKeyId}/revoke:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: apiKeyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [projects]
      operationId: revokeApiKey
      summary: Revoke an API key at once (maintainers and administrators)
      responses:
        "200":
          description: The revoked key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{projectKey}/dimensions:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listDimensions
      summary: List the project's classification dimensions and their values (anyone who can see the project)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The project's dimensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [projects]
      operationId: createDimension
      summary: Add a project-specific dimension (maintainers and administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDimensionRequest"
      responses:
        "201":
          description: The dimension
          content:
