        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [integrations]
      operationId: createWebhook
      summary: Subscribe an endpoint to the project's events (maintainers); the signing secret is returned only now
      description: >-
        Deliveries are POSTed as JSON with the headers X-Provenly-Event, X-Provenly-Delivery, X-Provenly-Timestamp and
        X-Provenly-Signature (`sha256=` + hex HMAC-SHA256 of `<timestamp>.<body>` with the secret). A delivery that does
        not get a 2xx is retried after 10 s, 1 min, 5 min and 30 min, then marked failed. Endpoints must be https and
        public (private, loopback and link-local addresses are refused) unless the deployment allows private targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: The webhook and its signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebhook"
        "400":
          $ref: "#/components/responses/BadRequest"
