# Backend E2E inventory: functional journeys reachable from the public REST
# interface, run by Playwright against the coverage-instrumented binary.
targets:
  - id: BE-E2E-001
    description: health check responds through the public interface
  - id: BE-E2E-002
    description: test case lifecycle with server-assigned immutable TC-ID, edit, deprecate and reactivate
  - id: BE-E2E-003
    description: optional steps can be added, reordered, edited and deleted
  - id: BE-E2E-004
    description: CI ingestion with TC-ID extraction (property + name fallback), snapshot summary and diagnostics
  - id: BE-E2E-005
    description: resending an attempt is idempotent (a different report is warned, not applied) and a rerun creates a new run
  - id: BE-E2E-006
    description: result history across runs and snapshot stability after catalog changes
  - id: BE-E2E-007
    description: projects through the public API - per-project numbering, ingestion with ?project= (its universe, wrong_project for another project's key), externalRunId unique per project, run filter and summary keys
  - id: BE-E2E-008
    description: accounts through the public API - 401 without a session, wrong passwords, an invitation accepted once, bearer sessions, admin-only user listing and a password change that signs the old session out
  - id: BE-E2E-009
    description: roles through the public API - an invitation grants a project role, a viewer sees only their project and gets 403 on writes, a member edits but cannot deprecate or create projects, removal makes the project invisible
  - id: BE-E2E-010
    description: CI API keys through the public API - 401 without a key, a key reports into its project by default (404 for another), opens no other route, records its last use, never appears in lists, and stops at once when revoked
  - id: BE-E2E-011
    description: optimistic locking through the public API - reads return the version as ETag, a stale If-Match gets 412 and changes nothing, step writes advance the same version, no If-Match keeps last-write-wins and a malformed one is 400
  - id: BE-E2E-012
    description: snapshot amendment through the public API - a reported manual TC-ID is included in a run by a maintainer; summary, run and outcome follow the amended universe, the snapshot total is kept, the history records who and why; repeats are 409 and unreported TC-IDs 400
  - id: BE-E2E-013
    description: retries through the public API - Surefire flaky and rerun attempts are stored with their attempt and details; the last attempt is the logical result in run outcome, summary (flaky) and results (retried flag)
  - id: BE-E2E-014
    description: gzip reports through the public API - a gzip report is ingested like a plain one; a gzip bomb is a 413 problem (limit on the decompressed body); a broken stream is 400 and other encodings 415
  - id: BE-E2E-015
    description: taxonomy through the public API - a new project gets the built-in dimensions; values and dimensions are added (duplicates 409); test cases are created with normalized tags and a classification and filtered by tag and by dimension:value pairs; archived values cannot be assigned (400 on the dimension field); clearing tags and a dimension advances the ETag
  - id: BE-E2E-016
    description: suites through the public API - a query and a static suite are created; a run reported with ?suite= expects only the suite (no untested, other results outside the universe) and names its suite; runs and test cases filter by suite; archived suites take no runs (409) and unknown ones are 404
  - id: BE-E2E-017
    description: manual execution through the public API - a manual run expects the manual test cases, takes a failure (note, failed step) and a passing re-test (attempt 2, not flaky), completes as passed and then refuses results; the test case history shows both results
  - id: BE-E2E-018
    description: requirements through the public API - a native requirement is numbered R-1; a Jira import creates then updates by external id and marks it synced; linking test cases moves coverage from uncovered to not_run, failing (a failed latest result) and passing (the re-run); requirements filter by test case; duplicates are 409, foreign test cases 400, unknown ids 404
  - id: BE-E2E-019
    description: issue verification through the public API - a native issue is I-1 and unlinked; a Jira import with its state is linked to a test case (unverified); a failing run makes it a known issue with the run as evidence; a later skip is inconclusive and keeps it; a closing re-import makes it reopen, a passing run validated fixed, reopening it not reproducible; filters by test case, bad states, imports without state, duplicates and unknown ids are refused
  - id: BE-E2E-020
    description: project quality through the public API - automation rate over active test cases, never-executed test cases listed, flaky counts over the latest runs narrowed by window; out-of-range or malformed staleDays and window are 400 and unknown projects 404
  - id: BE-E2E-021
    description: live runs through the public API - a live run starts with its snapshot (a repeated start returns it), takes streamed events idempotently by event id (duplicates counted, invalid events 400), shows provisional progress; its JUnit report completes it with the final results and the reconciliation names the test that started but never finished live; events after completion are 409
  - id: BE-E2E-022
    description: the Playwright reporter against the real API with a project API key - it starts a live run, streams the tests' events (TC-IDs from the title and from a tag, attempts on retries) and sends the final JUnit report with every attempt; the run completes as live, passed with one flaky test, consistent with its events, keeping both attempts of the retried test
  - id: BE-E2E-023
    description: OpenTelemetry through the public API - responses carry X-Trace-Id; a W3C traceparent sent by the caller is continued (health and a JUnit ingestion keep the caller's trace id); requests without one get a new trace
  - id: BE-E2E-024
    description: integrations through the public API - a webhook gets its secret once (never listed); a JUnit run is delivered by the worker within seconds as run.completed with a signature the receiver verifies, and the delivery is listed as succeeded; invalid endpoints are 400; GitHub Issues is connected with a token shown only as a hint, a sync mirrors the double's issues (not pull requests) with their state using the token, and the connection can be changed and removed
  - id: BE-E2E-025
    description: MCP through the public API - without a session the endpoint is 401; an agent with a session token initializes (protocol 2025-06-18), lists the tools and reads a project's test cases, a test case's history, a run and the project's quality as the user; a missing test case is a tool error
  - id: BE-E2E-026
    description: audit log through the public API - a user's project rename and API key creation and a CI ingestion with that key are audited newest first with actor (the user, or the key by prefix and name), route, path, project and status; tokens never appear; malformed filters are 400; an API key cannot read the log
  - id: BE-E2E-027
    description: sign-in throttle through the public API - five failed sign-ins of a username answer 401, the sixth (and the same username in other case) 429 with how long; another username still gets 401
  - id: BE-E2E-028
    description: sharded runs through the public API - two Playwright reporters with --shard 1/2 and 2/2 and a project API key send one report each (no live streaming); the first creates a running sharded run (incomplete, shard 2 missing), the second completes it with both shards' results, each marked and filterable by shard
  - id: BE-E2E-029
    description: long lists through the public API (DEC-78) - requirements answer a page with coverageCounts over every page and reject pageSize 101; test cases are found by key in lower case and by title in any case among 105; a blank q is 400
  - id: BE-E2E-030
    description: personal access tokens through the public API (card #62) - 366 days is refused, a 365-day token over one project reads its test cases through REST and MCP from a cookie-less client, gets 403 for another project, administration and any write ("read-only"), records its last use and is 401 once revoked
  - id: BE-E2E-031
    description: filtering runs (deployed audit) through the public API - runs of one branch, of one execution status and of a creation window are listed newest first; a window whose start is after its end is a 400
