name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  NODE_VERSION: "22"
  SQLC_VERSION: "1.31.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  backend-lint:
    name: Backend · build, lint, vet, sqlc drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/covgate/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: gofmt
        run: test -z "$(gofmt -l backend tools)" || (gofmt -l backend tools; exit 1)
      - name: go vet
        working-directory: backend
        run: go vet ./... && go vet -tags integration,contract ./test/...
      - name: golangci-lint
        working-directory: backend
        run: |
          # Retry: module downloads/checksum lookups occasionally fail on the runner network.
          for attempt in 1 2 3; do
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done
          golangci-lint run ./...
          golangci-lint run --build-tags integration,contract ./test/...
      - name: sqlc generated code is in sync
        working-directory: backend
        run: |
          curl -sSL "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin sqlc
          sqlc diff
      - name: covgate tool tests
        working-directory: tools/covgate
        run: go vet ./... && go test ./...
      - name: Known vulnerabilities (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -C backend ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest -C tools/covgate ./...

  frontend-lint:
    name: Frontend · build, lint, typecheck, client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: OpenAPI client is in sync with api/openapi.yaml
        working-directory: frontend
        run: npm run gen:api:check
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: E2E typecheck
        working-directory: e2e
        run: npm ci && npm run typecheck
      - name: Known vulnerabilities (npm audit)
        run: |
          npm --prefix frontend audit --audit-level=high
          npm --prefix e2e audit --audit-level=high

  backend-unit:
    name: Backend · Unit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/covgate/go.sum
      - run: make test-backend-unit
      - name: Fuzz (request parameters, JUnit parser)
        run: make fuzz
      - name: Gate
        run: cd tools/covgate && go run . -root "$GITHUB_WORKSPACE" -gates backend-unit -evidence=false
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evidence-backend-unit
          path: coverage/out/
          if-no-files-found: ignore

  backend-integration:
    name: Backend · Integration gate (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/covgate/go.sum
      - run: make test-backend-integration
      - name: Gate
        run: cd tools/covgate && go run . -root "$GITHUB_WORKSPACE" -gates backend-integration -evidence=false
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evidence-backend-integration
          path: coverage/out/
          if-no-files-found: ignore

  backend-contract:
    name: Backend · Contract gate (httpexpect + kin-openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/covgate/go.sum
      - run: make test-backend-contract
      - name: Gate
        run: cd tools/covgate && go run . -root "$GITHUB_WORKSPACE" -gates backend-contract -evidence=false
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evidence-backend-contract
          path: coverage/out/
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend · ${{ matrix.layer }} gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, integration, contract]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: tools/covgate/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:${{ matrix.layer }}
        working-directory: frontend
      - name: Gate
        run: cd tools/covgate && go run . -root "$GITHUB_WORKSPACE" -gates frontend-${{ matrix.layer }} -evidence=false
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evidence-frontend-${{ matrix.layer }}
          path: frontend/coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E gates (Playwright, instrumented stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provenly
          POSTGRES_PASSWORD: provenly
          POSTGRES_DB: provenly_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U provenly"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/covgate/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: ./scripts/e2e.sh
        env:
          CI: "true"
          E2E_DATABASE_URL: postgres://provenly:provenly@localhost:5432/provenly_e2e?sslmode=disable
      - name: Gates
        run: cd tools/covgate && go run . -root "$GITHUB_WORKSPACE" -gates backend-e2e,frontend-e2e -evidence=false
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evidence-e2e
          path: e2e/coverage/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  docker:
    name: Docker · images and environment smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file envs/qa.env
    steps:
      - uses: actions/checkout@v5
      - name: Build images and start the demo environment (docker compose up)
        run: docker compose up -d --build --wait
      - name: Demo starts from the demo snapshot
        run: curl -fsS localhost:8080/api/v1/test-runs | grep -q '"totalItems":5'
      - name: README POC walkthrough runs verbatim on the fresh demo
        run: ./scripts/readme-flow.sh http://localhost:8080
      - name: Smoke test through nginx
        run: ./scripts/smoke.sh http://localhost:3000
      - name: Data persists across down/up
        run: |
          docker compose down
          docker compose up -d --wait
          curl -fsS localhost:8080/api/v1/test-cases?pageSize=100 | grep -q 'Smoke test case'
      - name: A second environment runs side by side (qa)
        run: |
          $COMPOSE up -d --wait
          ./scripts/smoke.sh http://localhost:3100
      - name: Edge-case probe against the qa environment (through nginx)
        run: python3 scripts/probe/edge_cases.py --base http://localhost:3100
      - name: demo-reset brings demo back to its snapshot
        run: |
          make demo-reset
          ! curl -fsS localhost:8080/api/v1/test-cases?pageSize=100 | grep -q 'Smoke test case'
      - name: Logs
        if: failure()
        run: docker compose logs; $COMPOSE logs
      - name: Clean up
        if: always()
        run: docker compose down -v; $COMPOSE down -v

  coverage-report:
    name: Coverage · 8 gates + consolidated
    needs: [backend-unit, backend-integration, backend-contract, frontend-tests, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/covgate/go.sum
      - uses: actions/download-artifact@v5
        with:
          pattern: evidence-backend-*
          path: coverage/out
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: evidence-frontend-*
          path: frontend/coverage
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: evidence-e2e
          path: e2e/coverage
      - name: Evaluate the 8 gates and the 2 consolidated gates (fails below 100%)
        run: cd tools/covgate && go run . -root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/out/coverage-report.*
            coverage/out/consolidated-coverage.md
            coverage/out/backend-consolidated.html
