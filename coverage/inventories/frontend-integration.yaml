# Frontend Integration inventory: components rendered against the API mocked
# with MSW (Vitest + Testing Library). Every UI surface (.tsx under src/app,
# src/features, src/components except vendored ui/) must be referenced by at
# least one target; a new component without a target is reported as a gap.
targets:
  - id: FE-INT-001
    description: application shell, navigation, index redirect and not-found page
    surfaces: [src/app/Layout.tsx, src/app/routes.tsx, src/app/NotFoundPage.tsx]
  - id: FE-INT-002
    description: test case list with status filter, pagination and empty state
    surfaces: [src/features/test-cases/TestCaseListPage.tsx, src/components/Pagination.tsx]
  - id: FE-INT-003
    description: create a test case (TC-ID from the backend), API validation errors, cancel
    surfaces: [src/features/test-cases/NewTestCasePage.tsx, src/features/test-cases/TestCaseForm.tsx]
  - id: FE-INT-004
    description: test case detail distinguishes current definition from observed execution metadata; edit keeps the TC-ID
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx, src/features/test-cases/TestCaseForm.tsx]
  - id: FE-INT-005
    description: deprecate with confirmation, reactivate, and error reporting
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx]
  - id: FE-INT-006
    description: steps management (add, edit, cancel, delete, move up/down, empty and error states)
    surfaces: [src/features/test-cases/StepsEditor.tsx]
  - id: FE-INT-007
    description: execution history of a TC-ID across runs with observed metadata (executed and reported dates), pagination
    surfaces: [src/features/test-cases/TestCaseHistory.tsx]
  - id: FE-INT-008
    description: test run list with verdict, pass rate, outcome breakdown, execution status, metadata, empty state and pagination
    surfaces: [src/features/test-runs/TestRunListPage.tsx]
  - id: FE-INT-009
    description: test run detail with verdict, pass rate, metadata and summary (counts, the three percentages, pass rate, untested links)
    surfaces: [src/features/test-runs/TestRunDetailPage.tsx, src/features/test-runs/RunSummary.tsx, src/components/StatusBadge.tsx]
  - id: FE-INT-010
    description: TC-ID diagnostics (missing/malformed/unknown/deprecated) and outside-universe test cases with "mark as automated"
    surfaces: [src/features/test-runs/RunDiagnostics.tsx]
  - id: FE-INT-011
    description: individual run results filtered by status and correlation, TC-ID links, pagination
    surfaces: [src/features/test-runs/RunResults.tsx, src/components/StatusBadge.tsx]
  - id: FE-INT-012
    description: API failures and not-found resources are surfaced as error alerts
    surfaces: [src/components/QueryState.tsx]
  - id: FE-INT-013
    description: the app boots with its providers and browser router
    surfaces: [src/app/App.tsx]
  - id: FE-INT-014
    description: a manual test case that receives automated results shows a warning and can be marked automated
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx]
  - id: FE-INT-015
    description: report parse errors (kept/discarded) on the run detail and unknown vs sub-millisecond durations
    surfaces: [src/features/test-runs/RunParseErrors.tsx]
  - id: FE-INT-016
    description: runs whose CI execution was interrupted or cancelled are flagged as possibly incomplete
    surfaces: [src/features/test-runs/TestRunDetailPage.tsx, src/features/test-runs/TestRunListPage.tsx]
  - id: FE-INT-017
    description: every page has a single h1, real section headings (h2) and its own browser tab title
    surfaces: [src/components/PageTitle.tsx, src/components/ui/card.tsx]
  - id: FE-INT-018
    description: >-
      double submits send one request, a page past the end moves to the last page, filtered empty states,
      invalid ids are not found without calling the API, and loading/error pages set the tab title
    surfaces:
      [
        src/api/queries.ts,
        src/components/Pagination.tsx,
        src/components/QueryState.tsx,
        src/features/test-cases/TestCaseListPage.tsx,
        src/features/test-cases/TestCaseDetailPage.tsx,
        src/features/test-runs/TestRunListPage.tsx,
        src/features/test-runs/TestRunDetailPage.tsx,
        src/features/test-runs/RunResults.tsx,
      ]
  - id: FE-INT-019
    description: >-
      step editor feedback: a rejected step keeps what was typed, only the latest action's error is shown (a later
      success clears it), and a failed step action refetches the possibly stale list
    surfaces: [src/features/test-cases/StepsEditor.tsx]
  - id: FE-INT-020
    description: the step editor at its limits - 100 steps rendered, the last one moved up, an expected result cleared by editing
    surfaces: [src/features/test-cases/StepsEditor.tsx]
  - id: FE-INT-021
    description: a result's full error details (stack trace, every failure of the testcase) expand on demand with an accessible toggle
    surfaces: [src/features/test-runs/RunResults.tsx]
  - id: FE-INT-022
    description: the projects page lists projects, creates one (it becomes the current project), reports a key in use, renames with cancel and error, and paginates
    surfaces: [src/features/projects/ProjectsPage.tsx]
  - id: FE-INT-023
    description: the header's current project narrows test case and run lists (remembered in the browser; an unknown remembered key means every project) and runs show their project key
    surfaces: [src/features/projects/ProjectSwitcher.tsx, src/features/projects/ProjectProvider.tsx, src/app/Layout.tsx, src/features/test-runs/TestRunListPage.tsx, src/features/test-cases/TestCaseListPage.tsx]
  - id: FE-INT-024
    description: a new test case is created in the chosen project (default the current one) and numbered with its key; an unknown project is reported
    surfaces: [src/features/test-cases/NewTestCasePage.tsx]
  - id: FE-INT-025
    description: run results show the test case key the API resolves (another project's key included), the id when there is none, and wrong_project diagnostics
    surfaces: [src/features/test-runs/RunResults.tsx, src/features/test-runs/RunDiagnostics.tsx, src/features/test-runs/RunSummary.tsx]
  - id: FE-INT-026
    description: without a session every page sends to sign-in and returns to the page asked for (never to another origin); wrong passwords are reported; sign-out and an expired session go back to sign-in; an unknown identity error is shown
    surfaces: [src/features/auth/LoginPage.tsx, src/app/Layout.tsx]
  - id: FE-INT-027
    description: administrators list users and create (copy) and revoke invitation links, with errors and pagination; members see no Users page
    surfaces: [src/features/auth/UsersPage.tsx]
  - id: FE-INT-028
    description: an invitation link creates the account (passwords must match) and signs the new user in; taken or invalid usernames and used or token-less links are reported
    surfaces: [src/features/auth/AcceptInvitePage.tsx]
  - id: FE-INT-029
    description: the account page shows who is signed in and changes the password (mismatch and wrong current password reported)
    surfaces: [src/features/auth/AccountPage.tsx]
  - id: FE-INT-030
    description: each role sees only its actions - viewers read (no edit, deprecate, steps editing, new test case, rename, mark automated), members edit and create in their projects, maintainers deprecate and rename; projects without a role do not show
    surfaces: [src/features/test-cases/TestCaseDetailPage.tsx, src/features/test-cases/StepsEditor.tsx, src/features/projects/ProjectsPage.tsx, src/features/test-runs/RunDiagnostics.tsx]
  - id: FE-INT-031
    description: project members - administrators and maintainers add (unknown users reported), change and remove members; viewers see the list without controls; pagination and unknown projects
    surfaces: [src/features/projects/ProjectMembersPage.tsx]
  - id: FE-INT-032
    description: an invitation can grant a project role, shown in the invitation list
    surfaces: [src/features/auth/UsersPage.tsx]
  - id: FE-INT-033
    description: project API keys - a maintainer creates a key (shown once with the CI step), lists them by page with last use, revokes one; failures are shown where they happen; members and viewers do not see keys
    surfaces: [src/features/projects/ApiKeysSection.tsx]
  - id: FE-INT-034
    description: concurrent edits - a stale test case edit, step write or deprecation is refused with a conflict notice and nothing is overwritten; Reload shows the other version and the next save works; successive step writes carry the version forward without false conflicts
  - id: FE-INT-035
    description: snapshot amendment - a maintainer includes a reported test case in a run with a reason; the run shows an edited badge (detail and list) and the amendment history; refused amendments are reported; members only see "Mark as automated"
    surfaces: [src/features/test-runs/RunAmendments.tsx]
  - id: FE-INT-036
    description: retries - a run shows its flaky count (detail and list) and flaky test cases; results and the test case history mark each attempt and the retried ones; single attempts show no marker
  - id: FE-INT-037
    description: taxonomy - maintainers add dimensions and values and archive or restore them (duplicates reported), viewers only read; a test case is created and edited with tags and a classification (only changed dimensions sent, archived values only when current, field errors on tags and dimensions); the list shows tags and filters by tag and, within a project, by classification
    surfaces: [src/features/projects/ClassificationSection.tsx, src/features/test-cases/TestCaseForm.tsx, src/features/test-cases/TestCaseListPage.tsx]
  - id: FE-INT-038
    description: suites - the page asks for a project, lists its suites and creates query suites (tag and classification) and static ones; a static suite adds and removes test cases, a query suite shows its matches; archive and restore; failures are reported; viewers only read; unknown suites are not found; runs show their suite (badge, list filter linked from the suite)
    surfaces: [src/features/suites/SuitesPage.tsx, src/features/suites/SuiteDetailPage.tsx, src/features/test-runs/TestRunListPage.tsx, src/components/StatusBadge.tsx]
  - id: FE-INT-039
    description: manual execution - a member starts a manual run (project, optional suite, manual or all test cases, branch), records pass/fail/blocked/skip with a note and the failed step (only for failures), re-tests (the last result counts) and completes or cancels it; refusals are reported; a run without expected test cases says so; viewers see the run without the recording panel
    surfaces: [src/features/manual/NewManualRunPage.tsx, src/features/manual/ManualExecution.tsx, src/features/test-runs/TestRunDetailPage.tsx, src/features/test-runs/TestRunListPage.tsx]
  - id: FE-INT-040
    description: requirements - the page asks for a project, lists requirements with their coverage and adds native (R-n) and external (Jira, GitHub, Azure DevOps) ones, reporting duplicates; a requirement shows its source, the latest result of each covering test case, links and unlinks test cases and archives/restores (failures reported); the test case page lists the requirements it covers; viewers only read; unknown requirements are not found
    surfaces: [src/features/requirements/RequirementsPage.tsx, src/features/requirements/RequirementDetailPage.tsx, src/features/requirements/CoveredRequirements.tsx, src/features/test-cases/TestCaseDetailPage.tsx]
  - id: FE-INT-041
    description: issues - the list asks for a project, shows each issue's state and verification, filters by state and adds native and tracker issues (a duplicate is reported); the issue page shows each test's conclusive evidence and run, an inconclusive latest run, closes and reopens (verification follows), links and unlinks, and reports failures; the test case page lists its issues; viewers only read; a run splits its failures into known issues and new failures
    surfaces: [src/features/issues/IssuesPage.tsx, src/features/issues/IssueDetailPage.tsx, src/features/issues/LinkedIssues.tsx, src/features/issues/RunKnownIssues.tsx, src/features/test-cases/TestCaseDetailPage.tsx, src/features/test-runs/TestRunDetailPage.tsx]
  - id: FE-INT-042
    description: quality dashboard - asks for a project; shows the latest run, the pass-rate trend (each bar links to its run), automation rate, test cases never or not recently executed and flaky test cases, re-reading them when the stale period or the run window changes; breaks requirement coverage (archived ones excluded) and issue verification down; empty projects and failing reads say so
    surfaces: [src/features/dashboard/DashboardPage.tsx]
  - id: FE-INT-043
    description: live runs - a running live run shows provisional progress (finished, running, waiting) and each test case's live state, polls, and when the final report arrives reloads as completed with the reconciliation (mismatch kinds, live and final statuses, unknown TC-IDs); a consistent run lists no mismatches; batch runs have no live panel
    surfaces: [src/features/live/LivePanel.tsx, src/features/test-runs/TestRunDetailPage.tsx]
  - id: FE-INT-044
    description: project integrations - a maintainer adds a webhook and sees its signing secret once, pings it, pauses and resumes it, and pages its deliveries (status, attempts, answer); connects GitHub Issues (repository, labels, token shown only as a hint), syncs (created/updated), sees a failed sync's error, changes the repository keeping the token, rotates the token and disconnects; an unreadable token, failed writes and a failed read are reported; members and viewers see no integrations
    surfaces: [src/features/projects/WebhooksSection.tsx, src/features/projects/GitHubSection.tsx, src/features/projects/ProjectMembersPage.tsx]
  - id: FE-INT-045
    description: the account page shows how to connect an MCP client (Claude Code) as the signed-in user - sign in for a session token, then register the endpoint with it
    surfaces: [src/features/auth/AccountPage.tsx]
  - id: FE-INT-046
    description: audit log - an administrator reads who changed what (users and API keys, route, path, project), pages, filters by project (normalized) and actor and sees an empty result; other users have no Audit link and are refused
    surfaces: [src/features/audit/AuditPage.tsx, src/app/Layout.tsx]
  - id: FE-INT-047
    description: sign-in throttle - after five failed sign-ins the login page shows that the username is locked and for how long
    surfaces: [src/features/auth/LoginPage.tsx]
