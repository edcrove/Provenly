# Each module generates its own typed query package from its own migrations
# only: there is no shared global schema across modules.
version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations/00001_catalog.sql
      - migrations/00012_projects.sql
      - migrations/00017_test_case_versions.sql
      - migrations/00020_taxonomy.sql
      - migrations/00021_suites.sql
      - migrations/00024_requirements.sql
      - migrations/00025_issues.sql
    queries: queries/catalog.sql
    gen:
      go:
        package: catalogdb
        out: internal/catalog/catalogdb
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
  - engine: postgresql
    schema:
      - migrations/00002_execution.sql
      - migrations/00003_deprecated_results_link.sql
      - migrations/00004_parse_errors_and_nullable_duration.sql
      - migrations/00005_parse_error_severity.sql
      - migrations/00006_run_report_digest.sql
      - migrations/00007_run_execution_status.sql
      - migrations/00013_run_projects.sql
      - migrations/00018_run_amendments.sql
      - migrations/00019_result_attempts.sql
      - migrations/00022_run_suites.sql
      - migrations/00023_manual_runs.sql
      - migrations/00026_live_runs.sql
      - migrations/00027_live_event_attempts.sql
      - migrations/00032_sharded_runs.sql
    queries: queries/execution.sql
    gen:
      go:
        package: executiondb
        out: internal/execution/executiondb
        sql_package: pgx/v5
        emit_interface: true
  - engine: postgresql
    schema:
      - migrations/00001_catalog.sql
      - migrations/00012_projects.sql
      - migrations/00014_identity.sql
      - migrations/00015_project_members.sql
      - migrations/00016_api_keys.sql
      - migrations/00033_user_offboarding.sql
    queries: queries/identity.sql
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
  - engine: postgresql
    schema:
      - migrations/00028_integrations.sql
    queries: queries/integrations.sql
    gen:
      go:
        package: integrationsdb
        out: internal/integrations/integrationsdb
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
  - engine: postgresql
    schema:
      - migrations/00029_audit.sql
      - migrations/00034_audit_summary.sql
    queries: queries/audit.sql
    gen:
      go:
        package: auditdb
        out: internal/audit/auditdb
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
