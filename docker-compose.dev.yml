# Hot reload override: `make dev ENV=qa` (docker compose -f docker-compose.yml -f docker-compose.dev.yml ...).
# - api: Go toolchain + air, ./backend bind-mounted; rebuilds and restarts on .go/.sql changes.
# - web: Vite dev server with HMR, ./frontend bind-mounted; /api proxied to the api service.
# Same database, ports and data as the environment it runs on.
services:
  api:
    image: provenly-api-dev:local
    build:
      context: ./backend
      target: dev
      secrets: [extra_ca]
    volumes:
      - ./backend:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      start_period: 120s
      retries: 40

  web:
    image: provenly-web-dev:local
    build:
      context: ./frontend
      target: dev
      secrets: [extra_ca]
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    ports: !override
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  go-mod:
  go-build:
  web-node-modules:
