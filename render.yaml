# Render Blueprint: a temporary, free Provenly to try (docs/self-hosting.md, "Try it on Render").
# Render → New → Blueprint → this repository (branch prototype/full-product). It creates:
#   provenly-ed-db   free PostgreSQL 16 (Render deletes free databases 30 days after creation)
#   provenly-ed-api  the API (Docker, free: sleeps after 15 min idle, ~1 min to wake); migrates on start
#   provenly-ed      the UI (static site), proxying /api/* to the API so the session cookie stays same-origin
# Render asks for PROVENLY_ADMIN_PASSWORD (at least 10 characters, not the demo password): sign in as admin with it.
# If Render had to rename the API (the name was taken), point the /api/* rewrite below at its real URL.

databases:
  - name: provenly-ed-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: provenly
    user: provenly
    ipAllowList: []

services:
  - type: web
    name: provenly-ed-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /readyz
    envVars:
      - key: PROVENLY_ENV
        value: prod
      - key: PROVENLY_AUTO_MIGRATE
        value: "true"
      - key: PROVENLY_DATABASE_URL
        fromDatabase:
          name: provenly-ed-db
          property: connectionString
      - key: PROVENLY_JWT_SECRET
        generateValue: true
      # 256 random bits in base64: exactly the 32-byte AES key the API expects.
      - key: PROVENLY_SECRETS_KEY
        generateValue: true
      - key: PROVENLY_ADMIN_USERNAME
        value: admin
      - key: PROVENLY_ADMIN_PASSWORD
        sync: false

  - type: web
    name: provenly-ed
    runtime: static
    region: virginia
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://provenly-ed-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # The same headers as the web container (frontend/security-headers.conf).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
