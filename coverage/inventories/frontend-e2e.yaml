# Frontend E2E inventory: UI journeys run by Playwright on the istanbul-instrumented bundle.
targets:
  - id: FE-E2E-001
    description: manage a test case in the UI (create, edit, steps, deprecate, reactivate)
  - id: FE-E2E-002
    description: POC demo flow (TC declared by an automated test -> CI JUnit -> summary with 3 percentages -> detail -> history)
  - id: FE-E2E-003
    description: resend is idempotent and a rerun appears as a new run in the UI
  - id: FE-E2E-004
    description: editing/deprecating test cases later does not change an existing run summary
  - id: FE-E2E-005
    description: unknown pages and missing resources are reported
  - id: FE-E2E-006
    description: a manual TC receiving automated results is flagged; marking it automated includes it in the next run only
  - id: FE-E2E-007
    description: a run whose CI pipeline broke (status=interrupted) is flagged as possibly incomplete, with its verdict and pass rate shown apart
  - id: FE-E2E-008
    description: long unbroken text (title, description, steps) wraps at 375 px without page overflow; HTML and emoji render literally; a step rejected by the API keeps what was typed; list pages fit 375 px
  - id: FE-E2E-009
    description: run pages load without console errors or failed requests, and a result expands its full error details (every failure, stack trace)
  - id: FE-E2E-010
    description: create a project, work inside it (lists narrowed, new test case numbered with its key), read its run with its own keys, and go back to every project
  - id: FE-E2E-011
    description: sign in from a fresh browser (back to the page asked for), invite someone, they join from the link in another browser and sign out
  - id: FE-E2E-012
    description: an administrator adds a project member in the UI; the member signs in and sees only the actions of their role, which narrow after a demotion
  - id: FE-E2E-013
    description: a maintainer creates an API key on the project page (shown once with the CI step), CI reports a run with it, the key shows its last use, is revoked, and the run appears in the test case history
  - id: FE-E2E-014
    description: two people edit the same test case in two browsers; the second save is refused with a conflict notice, Reload shows the first person's change and the second change then saves on top of it
  - id: FE-E2E-015
    description: a maintainer includes a reported test case from the run page with a reason; the run shows the edited badge (detail and list), the amendment history and the new verdict
  - id: FE-E2E-016
    description: a run whose test passed on a retry (retry property) shows the flaky badge, the flaky test case, a passed verdict and each attempt marked in results and history
  - id: FE-E2E-017
    description: a maintainer adds a feature value on the project page, creates a test case with tags, feature and risk, changes its risk, and filters the project's list by tag and by classification
  - id: FE-E2E-018
    description: a maintainer creates a static suite and adds a test case in the UI; CI reports a run for the suite; the suite's runs link shows it and the run page shows the suite badge and its verdict
  - id: FE-E2E-019
    description: a tester starts a manual run from the run list, records a failure with a note and the failed step, re-tests it as passed and completes the run; the run shows the passed verdict and the recorded note
  - id: FE-E2E-020
    description: a member writes a requirement in the UI (numbered R-1, not covered), links a test case (not run); CI reports it failing and the requirement shows failing coverage; the test case page lists the requirement it covers with its coverage
  - id: FE-E2E-021
    description: a run shows a failure as new; a member reports a native issue and links the failing test case (known issue, evidence run shown); the run now lists it as a known issue; closing the issue makes it a reopen candidate, a passing run makes it validated fixed, and the test case page lists the issue
  - id: FE-E2E-022
    description: the dashboard of a project shows its latest run, a trend bar per run (linking to it), the automation rate, never-executed and flaky test cases and the requirement coverage breakdown
  - id: FE-E2E-023
    description: the run page follows a live run - provisional progress and per-test states update as CI streams events; when the final report arrives the page shows the completed run, its verdict and the reconciliation mismatch
  - id: FE-E2E-024
    description: a maintainer adds a webhook on the project page (secret shown once), pings it and sees the delivery succeed with its answer; connects GitHub Issues, syncs and finds the mirrored issue on the issues page
  - id: FE-E2E-025
    description: the account page shows the command that connects an MCP client to the instance's endpoint with a personal access token placeholder, never the username or password (card #62)
  - id: FE-E2E-026
    description: an administrator opens the audit log from the header and filters it by project to find a change made through the API; a test case edit reads in words under its project and the log filters by test case key (card #48)
  - id: FE-E2E-027
    description: with 105 test cases the requirement picker says "Showing 50 of 105, type to search.", finds the last one by its key typed in lower case and links it (shown by key, never by id); the suite picker finds one by title (DEC-78)
  - id: FE-E2E-028
    description: a person makes a personal access token on the account page for one project, sees it once with the MCP command, reads the project with it, sees its last use and revokes it (then 401) (card #62)
  - id: FE-E2E-029
    description: at phone width (390 px) the new manual run and new test case forms fit the screen - no input or select runs past the right edge, whatever the length of their options (deployed audit)
