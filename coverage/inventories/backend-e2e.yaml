# Backend E2E inventory: functional journeys reachable from the public REST
# interface, run by Playwright against the coverage-instrumented binary.
targets:
  - id: BE-E2E-001
    description: health check responds through the public interface
  - id: BE-E2E-002
    description: test case lifecycle with server-assigned immutable TC-ID, edit, deprecate and reactivate
  - id: BE-E2E-003
    description: optional steps can be added, reordered, edited and deleted
  - id: BE-E2E-004
    description: CI ingestion with TC-ID extraction (property + name fallback), snapshot summary and diagnostics
  - id: BE-E2E-005
    description: resending an attempt is idempotent (a different report is warned, not applied) and a rerun creates a new run
  - id: BE-E2E-006
    description: result history across runs and snapshot stability after catalog changes
  - id: BE-E2E-007
    description: projects through the public API - per-project numbering, ingestion with ?project= (its universe, wrong_project for another project's key), externalRunId unique per project, run filter and summary keys
  - id: BE-E2E-008
    description: accounts through the public API - 401 without a session, wrong passwords, an invitation accepted once, bearer sessions, admin-only user listing and a password change that signs the old session out
  - id: BE-E2E-009
    description: roles through the public API - an invitation grants a project role, a viewer sees only their project and gets 403 on writes, a member edits but cannot deprecate or create projects, removal makes the project invisible
  - id: BE-E2E-010
    description: CI API keys through the public API - 401 without a key, a key reports into its project by default (404 for another), opens no other route, records its last use, never appears in lists, and stops at once when revoked
  - id: BE-E2E-011
    description: optimistic locking through the public API - reads return the version as ETag, a stale If-Match gets 412 and changes nothing, step writes advance the same version, no If-Match keeps last-write-wins and a malformed one is 400
  - id: BE-E2E-012
    description: snapshot amendment through the public API - a reported manual TC-ID is included in a run by a maintainer; summary, run and outcome follow the amended universe, the snapshot total is kept, the history records who and why; repeats are 409 and unreported TC-IDs 400
  - id: BE-E2E-013
    description: retries through the public API - Surefire flaky and rerun attempts are stored with their attempt and details; the last attempt is the logical result in run outcome, summary (flaky) and results (retried flag)
