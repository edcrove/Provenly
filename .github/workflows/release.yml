name: Release

# A tag v<major>.<minor>.<patch> on a commit whose CI is green publishes a release: the API and web images on GHCR
# (tagged with the version and latest), the Playwright reporter on npm (when the NPM_TOKEN secret exists) and a GitHub
# release with generated notes. See docs/self-hosting.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Nothing by default: each job asks only for what it uses.
permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  ci-green:
    name: CI is green on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$conclusion" = "0" ]; then
            echo "::error::CI has not passed on ${GITHUB_SHA}; tag a commit whose CI is green." && exit 1
          fi

  images:
    name: Images (GHCR)
    needs: ci-green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: provenly-api
            context: backend
          - image: provenly-web
            context: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # `latest` follows the highest version only: tagging a patch of an older line must not move it back.
      - name: Is this the highest version?
        id: latest
        run: |
          highest=$(git ls-remote --tags --refs "${{ github.server_url }}/${{ github.repository }}" 'v*' \
            | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "tag=$([ "$highest" = "${GITHUB_REF_NAME}" ] && echo latest || echo none)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ steps.latest.outputs.tag == 'latest' && format('ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0

  reporter:
    name: Playwright reporter (npm)
    needs: ci-green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: reporters/playwright
      - name: Version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: reporters/playwright
      - name: Publish (skipped without the NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish
        working-directory: reporters/playwright

  release:
    name: GitHub release
    needs: [images, reporter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag \
            --notes "Images: ghcr.io/${{ github.repository_owner }}/provenly-api:${GITHUB_REF_NAME} and provenly-web:${GITHUB_REF_NAME}. Self-hosting: docs/self-hosting.md."
