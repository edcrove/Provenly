<title>Provenly UI Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky flow index on the left, one large screenshot with caption and prev/next on the right; stacks on phones. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #16181d;
  --muted: #5d6573;
  --line: #dfe3ea;
  --accent: #2f5bd3;
  --accent-soft: #e8eefc;
  --new: #0f7a4a;
  --new-soft: #e3f4ec;
  --shot-bg: #eceff4;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #191c23; --fg: #e8eaf0; --muted: #9aa2b1; --line: #2b303b;
    --accent: #8aa8ff; --accent-soft: #1f2a47; --new: #5fd39b; --new-soft: #15342a; --shot-bg: #0c0e12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #191c23; --fg: #e8eaf0; --muted: #9aa2b1; --line: #2b303b;
  --accent: #8aa8ff; --accent-soft: #1f2a47; --new: #5fd39b; --new-soft: #15342a; --shot-bg: #0c0e12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 24px; }
header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; font-size: 0.85rem; color: var(--muted); align-items: center; }
.chip { display: inline-block; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--new-soft); color: var(--new); }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
nav h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 12px 8px 4px; font-weight: 600; }
nav h2:first-child { margin-top: 4px; }
nav button { all: unset; box-sizing: border-box; display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; }
nav button:hover { background: var(--accent-soft); }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
nav button:focus-visible, .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav .num { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); min-width: 1.6em; font-variant-numeric: tabular-nums; }
nav .lbl { flex: 1; min-width: 0; }
main { min-width: 0; display: grid; gap: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.cap { min-width: 0; }
.cap .flow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.cap h3 { margin: 2px 0 0; font-size: 1.15rem; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cap p { margin: 4px 0 0; color: var(--muted); max-width: 75ch; }
.cap code { font-family: var(--font-mono); font-size: 0.85em; }
.ctls { display: flex; gap: 8px; align-items: center; }
.ctl { all: unset; cursor: pointer; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 0.88rem; }
.ctl:hover { border-color: var(--accent); color: var(--accent); }
.pos { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.frame { background: var(--shot-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; justify-content: center; }
.frame img { display: block; max-width: 100%; height: auto; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.12); background: #fff; }
.frame.phone img { width: 375px; }
.hint { font-size: 0.8rem; color: var(--muted); }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; max-height: 260px; }
}
</style>

<div class="wrap">
  <header>
    <h1>Provenly UI Walkthrough</h1>
    <p>__NOTE__</p>
    <div class="legend"><span><span class="chip">New</span> flow added or fixed in this round</span><span class="hint">Keyboard: ← → to navigate</span></div>
  </header>

  <div class="layout">
    <nav id="nav" aria-label="Flows"></nav>
    <main>
      <div class="bar">
        <div class="cap">
          <div class="flow" id="flow"></div>
          <h3 id="title"></h3>
          <p id="desc"></p>
        </div>
        <div class="ctls">
          <button class="ctl" id="prev" type="button" aria-label="Previous">← Previous</button>
          <span class="pos" id="pos"></span>
          <button class="ctl" id="next" type="button" aria-label="Next">Next →</button>
        </div>
      </div>
      <div class="frame" id="frame"><img id="img" alt=""></div>
    </main>
  </div>
</div>

<script>
const flows = __FLOWS__

const items = flows.flatMap(([flow, shots]) => shots.map(([file, title, desc, isNew, phone]) => ({ flow, file, title, desc, isNew: !!isNew, phone: !!phone })))
const nav = document.getElementById('nav')
const buttons = []
let idx = 0
items.forEach((it, i) => {
  if (i === 0 || items[i - 1].flow !== it.flow) {
    const h = document.createElement('h2')
    h.textContent = it.flow
    nav.append(h)
  }
  const b = document.createElement('button')
  b.type = 'button'
  b.id = 'shot-' + it.file.slice(0, 2)
  b.innerHTML = `<span class="num">${it.file.slice(0, 2)}</span><span class="lbl">${it.title}</span>${it.isNew ? '<span class="chip">New</span>' : ''}`
  b.addEventListener('click', () => show(i))
  nav.append(b)
  buttons.push(b)
})

function show(i) {
  idx = (i + items.length) % items.length
  const it = items[idx]
  document.getElementById('flow').textContent = it.flow
  document.getElementById('title').innerHTML = it.title + (it.isNew ? ' <span class="chip">New</span>' : '')
  document.getElementById('desc').innerHTML = it.desc
  document.getElementById('pos').textContent = `${idx + 1} / ${items.length}`
  const img = document.getElementById('img')
  img.src = `shots/${it.file}.png`
  img.alt = `${it.flow}: ${it.title}`
  document.getElementById('frame').classList.toggle('phone', it.phone)
  buttons.forEach((b, j) => b.setAttribute('aria-current', j === idx ? 'true' : 'false'))
  buttons[idx].scrollIntoView({ block: 'nearest' })
  const next = items[(idx + 1) % items.length]
  new Image().src = `shots/${next.file}.png`
}
document.getElementById('prev').addEventListener('click', () => show(idx - 1))
document.getElementById('next').addEventListener('click', () => show(idx + 1))
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(idx + 1)
  if (e.key === 'ArrowLeft') show(idx - 1)
})
show(0)
</script>
