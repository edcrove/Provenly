name: Release

# A tag v<major>.<minor>.<patch> on a commit whose CI is green publishes a release: the API and web images on GHCR
# (tagged with the version and latest), the Playwright reporter on npm (when the NPM_TOKEN secret exists) and a GitHub
# release with generated notes. See docs/self-hosting.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write # npm provenance

env:
  NODE_VERSION: "22"

jobs:
  ci-green:
    name: CI is green on the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$conclusion" = "0" ]; then
            echo "::error::CI has not passed on ${GITHUB_SHA}; tag a commit whose CI is green." && exit 1
          fi

  images:
    name: Images (GHCR)
    needs: ci-green
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: provenly-api
            context: backend
          - image: provenly-web
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0

  reporter:
    name: Playwright reporter (npm)
    needs: ci-green
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: reporters/playwright
      - name: Version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: reporters/playwright
      - name: Publish (skipped without the NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish
        working-directory: reporters/playwright

  release:
    name: GitHub release
    needs: [images, reporter]
    runs-on: ubuntu-latest
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag \
            --notes "Images: ghcr.io/${{ github.repository_owner }}/provenly-api:${GITHUB_REF_NAME} and provenly-web:${GITHUB_REF_NAME}. Self-hosting: docs/self-hosting.md."
