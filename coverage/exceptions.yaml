  # ----------------------------------------------- backend-consolidated
  # Every statement must be executed by some layer (all layers merged), which
  # includes everything excepted from backend-unit. These are the ones no layer
  # can reach, plus test infrastructure compiled into the merged profile.
  - id: EXC-BE-CONS-001
    gate: backend-consolidated
    layer: consolidated
    side: backend
    target: internal/{catalog,execution,identity,integrations}/{catalog,execution,identity,integrations}db/*.sql.go
    reason: >-
      rows.Scan / rows.Err error branches of sqlc-generated :many queries. They only run when the database fails in
      the middle of streaming a result set after the query itself succeeded, which cannot be reproduced
      deterministically. Every uncovered line absorbed here is listed in the report.
    category: not-reachable
    evidence: >-
      Every query runs against Postgres (backend-integration BE-INT-Q:* targets) and every Query-error branch is
      executed with a closed pool (BE-INT-020).
    owner: edcrove
    createdAt: "2026-09-28"
    reviewBy: "2026-12-31"
    link: https://trello.com/c/GYvVe5Jx/27-coverage-measurement-exceptions-framework
    status: approved
  - id: EXC-BE-CONS-002
    gate: backend-consolidated
    layer: consolidated
    side: backend
    target: internal/platform/postgres/postgres.go:40
    reason: goose.SetDialect("postgres") error branch; the dialect is a constant that goose always supports.
    category: not-reachable
    evidence: Migrations run in BE-INT-001, BE-INT-015 and every E2E run.
    owner: edcrove
    createdAt: "2026-09-28"
    reviewBy: "2026-12-31"
    link: https://trello.com/c/GYvVe5Jx/27-coverage-measurement-exceptions-framework
    status: approved
  - id: EXC-BE-CONS-003
    gate: backend-consolidated
    layer: consolidated
    side: backend
    target: test/**
    reason: Test infrastructure (testcontainers bootstrap) compiled into the merged profile by -coverpkg=./...; not product code. Its uncovered lines are container start-up failure paths.
    category: test-support
    evidence: Executed by every integration and contract run; failures there fail those suites.
    owner: edcrove
    createdAt: "2026-09-28"
    reviewBy: "2026-12-31"
    link: https://trello.com/c/GYvVe5Jx/27-coverage-measurement-exceptions-framework
    status: approved
  - id: EXC-BE-CONS-004
    gate: backend-consolidated
    layer: consolidated
    side: backend
    target: internal/integrations/integrationsdb/db.go:29
    reason: sqlc-generated Queries.WithTx; the integrations store needs no transaction (every write is one statement), so nothing calls it.
    category: not-reachable
    evidence: Every integrations query runs against Postgres (BE-INT-Q:integrations.*, BE-INT-055, BE-INT-056).
    owner: edcrove
    createdAt: "2026-10-05"
    reviewBy: "2026-12-31"
    link: https://trello.com/c/GYvVe5Jx/27-coverage-measurement-exceptions-framework
