  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: The audit log, newest first - every authenticated change made through the API (administrators)
      description: >-
        One event per successful POST, PUT, PATCH or DELETE, and one per sign-in event (a sign-in that succeeds,
        fails with 401 or is refused with 429, a sign-out, an accepted invitation, a password reset; the actor is the
        account, or `unknown` when the username matches none). Each keeps the client IP and user agent. Who (a username, or an API key by prefix and name),
        the operation (method and route) and in words ("edited CHK-4 step 3"), the request path, the project it
        changed and the test case it touched. Request bodies are never recorded. MCP calls (reads) and live run
        events are not audited. Events recorded before the summary existed have none, and only a project their path
        named.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: project
          in: query
          required: false
          description: Only events that addressed this project.
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9]{1,9}$"
        - name: actor
          in: query
          required: false
          description: Only events of this actor (a username, exactly as listed).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: testCase
          in: query
          required: false
          description: Only events that touched this test case (its key).
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]{0,17}$"
            example: CHK-4
      responses:
        "200":
          description: Page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/mcp:
    post:
      tags: [agents]
      operationId: mcp
      summary: Model Context Protocol endpoint (Streamable HTTP, JSON responses) with read-only tools for agents
      description: >-
        One JSON-RPC 2.0 message per request (no batches): `initialize`, `ping`, `tools/list` and `tools/call`.
        Notifications and responses are accepted with 202 and no body. Tools are read-only and call this API
        in-process as the signed-in user, so they see what the user may see; an API error is a tool result with
        `isError: true` and the problem as text. Agents authenticate with a session token (`POST /auth/login`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcMessage"
      responses:
        "200":
          description: The JSON-RPC response (a result or a JSON-RPC error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "202":
          description: A notification or response, accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/v1/projects/{projectKey}/webhooks:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [integrations]
      operationId: listWebhooks
      summary: The project's webhooks with their latest delivery (maintainers); signing secrets are never returned
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The webhooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
