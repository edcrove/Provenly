      tags: [test-cases]
      operationId: createTestCase
      summary: Create a test case. The TC-ID is assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "201":
          description: Created
